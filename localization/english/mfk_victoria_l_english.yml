 mfk_capital_victoria_desc: "The Union is governed from Victoria, its purpose-built federal capital on the Potomac."
 mfk_capital_displaced: "Parliament Displaced"
 mfk_capital_displaced_desc: "The American Parliament no longer sits in its lawful seat. Many question the legitimacy of a government that cannot hold its own capital."
