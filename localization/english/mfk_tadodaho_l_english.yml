l_english:
 concept_tadodaho: "Tadodaho"
 concept_tadodaho_desc: "The Tadodaho is the Firekeeper of the Onondaga council fire and the presiding chief of the Haudenosaunee Grand Council, a title passed from holder to holder since the founding of the Great Law of Peace.\n\nThe Tadodaho is appointed by the Clan Mothers and can only be dehorned by them. While the Grand Hoyaneh treats with the British and speaks for the Longhouse in the NAU Parliament, the Tadodaho keeps the council fire, calls the Grand Council and guards the traditions of the Confederacy. The two rule side by side, and not always in agreement."
 character_role_tadodaho: "[concept_tadodaho]"
 character_role_tadodaho_title: "Tadodaho"
 mfk_onondaga_council_fire: "The Onondaga Council Fire"
 mfk_onondaga_council_fire_desc: "The [concept_tadodaho] keeps the council fire burning at Onondaga, lending the Confederacy's government the weight of the Great Law."
 mfk_tadodaho.1.t: "The Fire Is Passed On"
 mfk_tadodaho.1.d: "The [concept_tadodaho] has gone on to the Sky World. After the condolence ceremony, the Clan Mothers of the Onondaga have raised up [SCOPE.sCharacter('new_tadodaho').GetFullName] to take up the title and keep the council fire burning as the Great Law intends."
 mfk_tadodaho.1.f: "The fire at Onondaga has never been allowed to go out."
 mfk_tadodaho.1.a: "May the fire burn on."
 je_group_great_law: "The Great Law of Peace"
 je_tadodaho: "The Onondaga Council Fire"
 je_tadodaho_reason: "At Onondaga the council fire of the Haudenosaunee still burns, kept by the [concept_tadodaho]. Whatever bargains the [concept_grand_hoyaneh] strikes with the Crown and the Union, the Tadodaho answers only to the Great Law and the Clan Mothers who raised him up."
