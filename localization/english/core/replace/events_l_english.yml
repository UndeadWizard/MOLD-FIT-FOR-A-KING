l_english:
 great_cajun_rebellion.1.t:0 "The Great Cajun Rebellion"
 great_cajun_rebellion.1.d:0 "As the ink dries on the treaty, the streets of Nouvelle-Orléans erupt in celebration. The Spanish have formally recognized the hard-won independence of the brave people of Louisiane, relinquishing all claims to Téijane; Settlers are already staking claims in the virgin land. A new era dawns, and the future of Louisiane has never shone brighter."
 great_cajun_rebellion.1.f:0 ""In many ways, we have justified Spanish fears of how deep the tendrils of the British Empire have burrowed. Today we won our freedom, but tomorrow it could be Cuba, and the next Peru. I see joy all around me, yet I can't shake this dread of making a deal with the devil, especially when his price remains unpaid." - Jacques Villeré II"
 great_cajun_rebellion.1.a:0 "I've got an envie for some boudin!"
 great_cajun_rebellion.1.b:0 "Laissez les bons temps rouler!"

 # Mold Fit for a King
 mfk_tadodaho.1.t: "The Fire Is Passed On"
 mfk_tadodaho.1.d: "The [concept_tadodaho] has gone on to the Sky World. After the condolence ceremony, the Clan Mothers of the Onondaga have raised up [SCOPE.sCharacter('new_tadodaho').GetFullName] to take up the title and keep the Council Fire burning as the Great Law intends."
 mfk_tadodaho.1.f: "The fire at Onondaga has never been allowed to go out."
 mfk_tadodaho.1.a: "May the fire burn on."
 mfk_tadodaho.3.t: "Talk of Dehorning"
 mfk_tadodaho.3.d: "The Council Fire has grown cold between [SCOPE.sCharacter('hoyaneh_scope').GetFullName] and the [concept_tadodaho], [SCOPE.sCharacter('tadodaho_scope').GetFullName]. Now the Clan Mothers have begun to speak openly of the old remedy: taking the Antlers of Office from the [concept_grand_hoyaneh] and raising up another in his place."
 mfk_tadodaho.3.f: "The women who gave the antlers may also take them away."
 mfk_tadodaho.3.a: "We must win back the Council."
 mfk_tadodaho.4.t: "The Antlers of Office"
 mfk_tadodaho.4.d: "The Council and [SCOPE.sCharacter('hoyaneh_scope').GetFullName] have not been reconciled. The Clan Mothers have warned the [concept_grand_hoyaneh] three times, as the Great Law requires, and now the [concept_tadodaho], [SCOPE.sCharacter('tadodaho_scope').GetFullName], has called on him to answer.\n\nHe may yield his antlers, submit to the Council, or turn to the Crown for support, and risk breaking the Confederacy."
 mfk_tadodaho.4.f: "\"You have not heeded the warnings of your women. We take from you the antlers of your office.\""
 mfk_tadodaho.4.a: "The antlers are taken."
 mfk_tadodaho.4.b: "The Grand Hoyaneh submits to the Council."
 mfk_tadodaho.4.c: "The Grand Hoyaneh calls on the Crown."
 mfk_dehorning_removed_tt: "[SCOPE.sCharacter('hoyaneh_scope').GetFullName] is removed from office as [concept_grand_hoyaneh]."
 mfk_gg.1.t: "Appointing a Governor-General"
 mfk_gg.1.d: "The [concept_the_compact] leaves the government of the [SCOPE.sCountry('nau_scope').GetName] to the President-General and the American House of Commons, but the Crown's representative still confirms every ministry, presides over the Canadian Provinces and has the ear of every faction in the American Parliament.\n\nWhitehall must decide who will hold the office. A peer sent from London will keep the Provinces firmly in hand; an American raised to the post will flatter the Union, and draw the Canadian Provinces toward it."
 mfk_gg.1.f: "Ministers rise and fall in the House of Commons; the Crown endures."
 mfk_gg.1.opt_f: "Send a peer from London."
 mfk_gg.1.opt_a: "Elevate [SCOPE.sCharacter('crown_fav_1').GetFullName] of the [SCOPE.sCharacter('crown_fav_1').GetInterestGroup.GetName]."
 mfk_gg_appoint_tt_1: "[SCOPE.sCharacter('crown_fav_1').GetFullName] becomes [concept_governor_general] of the [SCOPE.sCountry('nau_scope').GetName] and the Crown's Favourite. The [SCOPE.sCharacter('crown_fav_1').GetInterestGroup.GetName] gain political strength and approval, while the Rural Folk resent the Crown's interference."
 mfk_gg.1.opt_b: "Elevate [SCOPE.sCharacter('crown_fav_2').GetFullName] of the [SCOPE.sCharacter('crown_fav_2').GetInterestGroup.GetName]."
 mfk_gg_appoint_tt_2: "[SCOPE.sCharacter('crown_fav_2').GetFullName] becomes [concept_governor_general] of the [SCOPE.sCountry('nau_scope').GetName] and the Crown's Favourite. The [SCOPE.sCharacter('crown_fav_2').GetInterestGroup.GetName] gain political strength and approval, while the Rural Folk resent the Crown's interference."
 mfk_gg.1.opt_c: "Elevate [SCOPE.sCharacter('crown_fav_3').GetFullName] of the [SCOPE.sCharacter('crown_fav_3').GetInterestGroup.GetName]."
 mfk_gg_appoint_tt_3: "[SCOPE.sCharacter('crown_fav_3').GetFullName] becomes [concept_governor_general] of the [SCOPE.sCountry('nau_scope').GetName] and the Crown's Favourite. The [SCOPE.sCharacter('crown_fav_3').GetInterestGroup.GetName] gain political strength and approval, while the Rural Folk resent the Crown's interference."
 mfk_gg.1.opt_d: "Elevate [SCOPE.sCharacter('crown_fav_4').GetFullName] of the [SCOPE.sCharacter('crown_fav_4').GetInterestGroup.GetName]."
 mfk_gg_appoint_tt_4: "[SCOPE.sCharacter('crown_fav_4').GetFullName] becomes [concept_governor_general] of the [SCOPE.sCountry('nau_scope').GetName] and the Crown's Favourite. The [SCOPE.sCharacter('crown_fav_4').GetInterestGroup.GetName] gain political strength and approval, while the Rural Folk resent the Crown's interference."
 mfk_gg.1.opt_e: "Keep the current arrangement for now."
 mfk_gg_british_peer_tt: "A British peer is sent to the [SCOPE.sCountry('nau_scope').GetName] as [concept_governor_general] and the Crown's Favourite. The Landowners gain political strength and approval, while the Rural Folk resent the Crown's interference."
 mfk_gg_canada_british_tt: "The Canadian Provinces come under #v Viceregal Administration#!, reducing their liberty desire."
 mfk_gg_canada_american_tt: "The Canadian Provinces receive #v An American Governor-General#!, increasing their liberty desire and improving their relations with the [SCOPE.sCountry('nau_scope').GetName]."
 mfk_gg.2.t: "A New Governor-General"
 mfk_gg.2.d_peer: "His Majesty has sent [SCOPE.sCharacter('new_crown_favourite').GetFullName] to serve as [concept_governor_general]. The new arrival has already taken up residence at Government House, where invitations, patronage and the ear of Whitehall now flow.\n\nNot everyone in the Union is pleased to see London send yet another lord to preside over American affairs."
 mfk_gg.2.d_american: "His Majesty has raised [SCOPE.sCharacter('new_crown_favourite').GetFullName] of the [SCOPE.sCharacter('new_crown_favourite').GetInterestGroup.GetName] to the office of [concept_governor_general], the first American trusted with the Crown's confidence in a generation. The Favourite and their allies now enjoy the patronage of Government House.\n\nTheir rivals in the American Parliament are already muttering that the Crown has chosen sides."
 mfk_gg.2.f: "\"The Governor-General confirms our President-General; it seems he now presumes to choose our friends as well.\""
 mfk_gg.2.a: "The Crown has spoken."
 mfk_gg.2.b: "Protest this interference to Whitehall."
