l_english:
 great_cajun_rebellion.1.t:0 "The Great Cajun Rebellion"
 great_cajun_rebellion.1.d:0 "As the ink dries on the treaty, the streets of Nouvelle-Orléans erupt in celebration. The Spanish have formally recognized the hard-won independence of the brave people of Louisiane, relinquishing all claims to Téijane; Settlers are already staking claims in the virgin land. A new era dawns, and the future of Louisiane has never shone brighter."
 great_cajun_rebellion.1.f:0 ""In many ways, we have justified Spanish fears of how deep the tendrils of the British Empire have burrowed. Today we won our freedom, but tomorrow it could be Cuba, and the next Peru. I see joy all around me, yet I can't shake this dread of making a deal with the devil, especially when his price remains unpaid." - Jacques Villeré II"
 great_cajun_rebellion.1.a:0 "I've got an envie for some boudin!"
 great_cajun_rebellion.1.b:0 "Laissez les bons temps rouler!"

 mfk_tadodaho.1.t: "The Fire Is Passed On"
 mfk_tadodaho.1.d: "The [concept_tadodaho] has gone on to the Sky World. After the condolence ceremony, the Clan Mothers of the Onondaga have raised up [SCOPE.sCharacter('new_tadodaho').GetFullName] to take up the title and keep the Council Fire burning as the Great Law intends."
 mfk_tadodaho.1.f: "The fire at Onondaga has never been allowed to go out."
 mfk_tadodaho.1.a: "May the fire burn on."
 mfk_tadodaho.3.t: "Talk of Dehorning"
 mfk_tadodaho.3.d: "The Council Fire has grown cold between [SCOPE.sCharacter('hoyaneh_scope').GetFullName] and the [concept_tadodaho], [SCOPE.sCharacter('tadodaho_scope').GetFullName]. Now the Clan Mothers have begun to speak openly of the old remedy: taking the Antlers of Office from the [concept_grand_hoyaneh] and raising up another in his place."
 mfk_tadodaho.3.f: "The women who gave the antlers may also take them away."
 mfk_tadodaho.3.a: "We must win back the Council."
 mfk_tadodaho.4.t: "The Antlers of Office"
 mfk_tadodaho.4.d: "The Council and [SCOPE.sCharacter('hoyaneh_scope').GetFullName] have not been reconciled. The Clan Mothers have warned the [concept_grand_hoyaneh] three times, as the Great Law requires, and now the [concept_tadodaho], [SCOPE.sCharacter('tadodaho_scope').GetFullName], has called on him to answer.\n\nHe may yield his antlers, submit to the Council, or turn to the Crown for support, and risk breaking the Confederacy."
 mfk_tadodaho.4.f: "\"You have not heeded the warnings of your women. We take from you the antlers of your office.\""
 mfk_tadodaho.4.a: "The antlers are taken."
 mfk_tadodaho.4.b: "The Grand Hoyaneh submits to the Council."
 mfk_tadodaho.4.c: "The Grand Hoyaneh calls on the Crown."
 mfk_dehorning_removed_tt: "[SCOPE.sCharacter('hoyaneh_scope').GetFullName] is removed from office as [concept_grand_hoyaneh]."
 mfk_gg.1.t: "Appointing a Governor-General"
 mfk_gg.1.d: "The [concept_the_compact] leaves the government of the [SCOPE.sCountry('nau_scope').GetName] to the President-General and the American House of Commons, but the Crown's representative still confirms every ministry, presides over the Canadian Provinces and has the ear of every faction in the American Parliament.\n\nWhitehall must decide who will hold the office. A peer sent from London will keep the Provinces firmly in hand; an American raised to the post will flatter the Union, and draw the Canadian Provinces toward it."
 mfk_gg.1.f: "Ministers rise and fall in the House of Commons; the Crown endures."
 mfk_gg.1.opt_f: "Send a peer from London."
 mfk_gg.1.opt_a: "Elevate [SCOPE.sCharacter('crown_fav_1').GetFullName] of the [SCOPE.sCharacter('crown_fav_1').GetInterestGroup.GetName]."
 mfk_gg_appoint_tt_1: "[SCOPE.sCharacter('crown_fav_1').GetFullName] is appointed [concept_governor_general] of the [SCOPE.sCountry('nau_scope').GetName] by the Crown. The [SCOPE.sCharacter('crown_fav_1').GetInterestGroup.GetName] gain political strength and approval, while the Rural Folk resent the Crown's interference."
 mfk_gg.1.opt_b: "Elevate [SCOPE.sCharacter('crown_fav_2').GetFullName] of the [SCOPE.sCharacter('crown_fav_2').GetInterestGroup.GetName]."
 mfk_gg_appoint_tt_2: "[SCOPE.sCharacter('crown_fav_2').GetFullName] is appointed [concept_governor_general] of the [SCOPE.sCountry('nau_scope').GetName] by the Crown. The [SCOPE.sCharacter('crown_fav_2').GetInterestGroup.GetName] gain political strength and approval, while the Rural Folk resent the Crown's interference."
 mfk_gg.1.opt_c: "Elevate [SCOPE.sCharacter('crown_fav_3').GetFullName] of the [SCOPE.sCharacter('crown_fav_3').GetInterestGroup.GetName]."
 mfk_gg_appoint_tt_3: "[SCOPE.sCharacter('crown_fav_3').GetFullName] is appointed [concept_governor_general] of the [SCOPE.sCountry('nau_scope').GetName] by the Crown. The [SCOPE.sCharacter('crown_fav_3').GetInterestGroup.GetName] gain political strength and approval, while the Rural Folk resent the Crown's interference."
 mfk_gg.1.opt_d: "Elevate [SCOPE.sCharacter('crown_fav_4').GetFullName] of the [SCOPE.sCharacter('crown_fav_4').GetInterestGroup.GetName]."
 mfk_gg_appoint_tt_4: "[SCOPE.sCharacter('crown_fav_4').GetFullName] is appointed [concept_governor_general] of the [SCOPE.sCountry('nau_scope').GetName] by the Crown. The [SCOPE.sCharacter('crown_fav_4').GetInterestGroup.GetName] gain political strength and approval, while the Rural Folk resent the Crown's interference."
 mfk_gg.1.opt_e: "Keep the current arrangement for now."
 mfk_gg_british_peer_tt: "A British peer is appointed [concept_governor_general] of the [SCOPE.sCountry('nau_scope').GetName] by the Crown. The Landowners gain political strength and approval if they serve British interests; otherwise the most influential interest group that does. The Rural Folk resent the Crown's interference."
 mfk_gg_canada_british_tt: "The Canadian Provinces come under #v Viceregal Administration#!, reducing their liberty desire."
 mfk_gg_canada_american_tt: "The Canadian Provinces receive #v An American Governor-General#!, increasing their liberty desire and improving their relations with the [SCOPE.sCountry('nau_scope').GetName]."
 mfk_gg.2.t: "A New Governor-General"
 mfk_gg.2.d_peer: "His Majesty has sent [SCOPE.sCharacter('new_crown_favourite').GetFullName] to serve as [concept_governor_general]. The new arrival has already taken up residence at Government House, where invitations, patronage and the ear of Whitehall now flow.\n\nNot everyone in the Union is pleased to see London send yet another lord to preside over American affairs."
 mfk_gg.2.d_american: "His Majesty has appointed [SCOPE.sCharacter('new_crown_favourite').GetFullName] of the [SCOPE.sCharacter('new_crown_favourite').GetInterestGroup.GetName] as [concept_governor_general], the first American trusted with the Crown's confidence in a generation. The new Governor-General and their allies now enjoy the patronage of Government House.\n\nTheir rivals in the American Parliament are already muttering that the Crown has chosen sides."
 mfk_gg.2.d_american_again: "His Majesty has appointed [SCOPE.sCharacter('new_crown_favourite').GetFullName] of the [SCOPE.sCharacter('new_crown_favourite').GetInterestGroup.GetName] as [concept_governor_general]. Another American at Government House: it seems the Crown's confidence in the Union is no passing fancy. The new Governor-General and their allies now enjoy the patronage of Government House.\n\nTheir rivals in the American Parliament are already muttering that the Crown has chosen sides."
 mfk_gg.2.d_american_return: "His Majesty has appointed [SCOPE.sCharacter('new_crown_favourite').GetFullName] of the [SCOPE.sCharacter('new_crown_favourite').GetInterestGroup.GetName] as [concept_governor_general]. After a spell under a lord from London, Government House is back in American hands. The new Governor-General and their allies now enjoy its patronage.\n\nTheir rivals in the American Parliament are already muttering that the Crown has chosen sides."
 mfk_gg.2.f: "\"The Governor-General confirms our President-General; it seems he now presumes to choose our friends as well.\""
 mfk_gg.2.a: "The Crown has spoken."
 mfk_gg.2.b: "Protest the Crown's favouritism to Whitehall."
 mfk_gg_no_trust_tt: "Relations with the [SCOPE.sCountry('nau_scope').GetName] are below #v Cordial#!: Whitehall will not trust an American with Government House."
 mfk_gg.3.t: "A New President-General"
 mfk_gg.3.d: "The American House of Commons has chosen [SCOPE.sCharacter('new_president_general').GetFullName] of the [SCOPE.sCharacter('new_president_general').GetInterestGroup.GetName] as President-General of the [SCOPE.sCountry('nau_scope').GetName]. Under the [concept_the_compact] the [concept_governor_general] must confirm the choice, and confirm it he will: the Crown does not overturn the Commons.\n\nWhat Whitehall can decide is the manner of it. A warm letter from the Palace is worth a great deal in Philadelphia; a bare formality, delivered without a word of congratulation, says just as much."
 mfk_gg.3.f: "The Crown confirms; it is not obliged to applaud."
 mfk_gg.3.a: "Send His Majesty's warm congratulations."
 mfk_gg.3.b: "Confirm the President-General with due formality."
 mfk_gg.3.c: "Confirm them, and nothing more."
 mfk_gg_formal_confirmation_tt: "The President-General takes office with neither the Crown's blessing nor its reproach. Relations with #v Great Britain#! are unchanged."
 mfk_gg_cold_favour_tt: "The Crown withdraws its favour and lends it to the most influential loyal interest group outside the government."
 mfk_gg.4.t: "A Cold Confirmation"
 mfk_gg.4.d: "The [concept_governor_general] has confirmed [SCOPE.sCharacter('new_president_general').GetFullName] as President-General, as the [concept_the_compact] requires. The letter from Whitehall that followed was two lines long and carried no congratulations.\n\nIn the American Parliament everyone has understood the message, and the Crown's patronage is already flowing to the opposition benches."
 mfk_gg.4.f: "\"A confirmation is a confirmation. The Commons chose; London merely signed.\""
 mfk_gg.4.a: "Let it pass."
 mfk_gg.4.b: "Answer London's coldness in kind."
 mfk_gg.5.t: "The Crown Confirms"
 mfk_gg.5.d_warm: "The [concept_governor_general] has confirmed [SCOPE.sCharacter('new_president_general').GetFullName] as President-General, and a letter from the Palace followed with His Majesty's warm congratulations. The new ministry begins with the Crown's blessing, and its friends in the American Parliament are making sure everyone knows it."
 mfk_gg.5.d_formal: "The [concept_governor_general] has confirmed [SCOPE.sCharacter('new_president_general').GetFullName] as President-General with all due formality. Whitehall offered neither praise nor reproach; the new ministry may govern as it sees fit."
 mfk_gg.5.f: "The Commons chose, and the Crown confirmed."
 mfk_gg.5.a: "Long live the King."


 mfk_tadodaho.6.t: "Leaving the Shade of the Pine"
 mfk_tadodaho.6.d: "The #v [SCOPE.sCharacter('departing_chief').GetCustom('mfk_nation_name')]#! no longer trust the Confederacy that sheltered them. Their chief, [SCOPE.sCharacter('departing_chief').GetFullName], has returned the wampum of welcome, and the nation is packing its lodges to seek a home elsewhere."
 mfk_tadodaho.6.f: "Shelter that is not honoured is no shelter at all."
 mfk_tadodaho.6.a: "Let them go in peace."

 mfk_tadodaho.7.t: "The Antlers Fall"
 mfk_tadodaho.7.d_fire: "Ten years have passed since John Brant took up the Antlers of Office, and the clans he swore to reconcile are as divided as ever. The Clan Mothers have given their three warnings, and the Council has lost patience.\n\nThe Dehorners called for a war chief to take his place, but the Council Fire held. The [concept_tadodaho], [SCOPE.sCharacter('tadodaho_scope').GetFullName], will hold the Council Fire and the Antlers together until the Great Law is mended."
 mfk_tadodaho.7.d_dehorners: "Ten years have passed since John Brant took up the Antlers of Office, and the clans he swore to reconcile are as divided as ever. The Clan Mothers have given their three warnings, but it was not the Council that moved first.\n\nThe Dehadína'ga·hä́·gwas, the Dehorners, have taken the antlers from Brant by force. At their head stands #b Alexander Norton#!, grandson of Teyoninhokarawen, the Mohawk war chief John Norton who fought beside the Crown, and the Council Fire can only watch."
 mfk_tadodaho.7.f: "The women who gave the antlers may also take them away."
 mfk_tadodaho.7.a: "The Fire and the Antlers are one."
 mfk_tadodaho.7.b: "The Dehorners have their war chief."

 mfk_tadodaho.8.t: "Strangers at the Western Door"
 mfk_tadodaho.8.d_traditional: "Runners have come to the Western Door with word that the #v [ROOT.GetCountry.GetCustom('mfk_last_sheltered_nation_name')]#!, driven from their lands by the Union's settlers, ask to settle among us. They burn tobacco as we do, keep the old ceremonies, and speak of the Creator in words the Clan Mothers understand. Some ten thousand of them wait at the edge of our lands.\n\nThe Clan Mothers would welcome them as younger kin. To turn them away would shame the Great Law."
 mfk_tadodaho.8.d_christian: "A delegation of the #v [ROOT.GetCountry.GetCustom('mfk_last_sheltered_nation_name')]#! has arrived at the Western Door, driven from their lands by the Union's advance. They come with Bibles and missionaries, speak English in council, and farm and trade like the settlers who displaced them. Some ten thousand of them ask to settle among us.\n\nThe Clan Mothers warn that such people will never be kin of the Longhouse. But the [concept_grand_hoyaneh] sees what the Dehorners see: a people who would owe everything to him, and nothing to Onondaga."
 mfk_tadodaho.8.f: "The Great Law gives shade to all who seek it, but not all who seek it will sit by the same fire."
 mfk_tadodaho.8.a: "Take them in beneath the Tree of Peace."
 mfk_tadodaho.8.b: "Settle them on the Grand Hoyaneh's own lands."
 mfk_tadodaho.8.c: "Turn them away."

 mfk_tadodaho.9.t: "The Great Law Renewed"
 mfk_tadodaho.9.d: "Through the years of John Brant's rule the Council Fire was tested: by the Grand Hoyaneh's ambitions, by the Dehorners, by the Union's settlers and the Crown's agents. It did not go out. The condolence has been spoken for the last time over the old quarrels, the Royaneh sit together beneath the Tree of Peace, and the Clan Mothers' voice carries as the Peacemaker intended.\n\nWhatever the Confederacy becomes, it will become it by the Great Law."
 mfk_tadodaho.9.f: "The fire at Onondaga has never been allowed to go out."
 mfk_tadodaho.9.a: "The Great Law endures."
 mfk_tadodaho.10.t: "The Fire Goes Out"
 mfk_tadodaho.10.d: "The Council Fire at Onondaga has been allowed to die. No condolence was spoken and no new Tadodaho was raised up; the Royaneh no longer travel to Onondaga, and the war chiefs no longer wait for their word.\n\nThe Confederacy is governed now from the Grand Hoyaneh's hall, by decree and by the strength of his warriors. The Clan Mothers mourn, but there is no fire left to gather around."
 mfk_tadodaho.10.f: "Some fires are put out. Others simply are not tended."
 mfk_tadodaho.10.a: "A new Confederacy for a new age."

 mfk_tadodaho.11.t: "The Antlers Kept"
 mfk_tadodaho.11.d_clan_mother: "John Brant has done what his father never could. He has listened to the Clan Mothers, kept the Council Fire burning, and bound the clans together by the Great Law rather than by fear. The Royaneh no longer speak of dehorning; they speak of the Peacemaker."
 mfk_tadodaho.11.d_grand_hoyaneh: "John Brant has reconciled the clans, though not as the Clan Mothers hoped. Railways run between the towns, plasm works line the rivers and a professional army stands where Isaac's warbands once did, all without a return to his father's tyranny. The Confederacy is stronger than it has been in a generation, and it is Brant's vision that made it so."
 mfk_tadodaho.11.d_covenant: "John Brant has kept his promise to reconcile the clans, giving neither the Clan Mothers nor his own warriors all they wanted. The covenant that ended his father's tyranny holds, and for now that is enough."
 mfk_tadodaho.11.f: "The antlers rest easier on a head the clans have chosen to keep."
 mfk_tadodaho.11.a: "The Great Law is restored."
 mfk_tadodaho.11.b: "Brant's vision prevails."
 mfk_tadodaho.11.c: "The Covenant holds."

 mfk_tadodaho.8.d_unwanted: "A delegation of the #v [ROOT.GetCountry.GetCustom('mfk_last_sheltered_nation_name')]#! has come to the Western Door, driven west and north by the Union's settlers. Some ten thousand of them ask to settle among us.\n\nBut when the matter is put across the fire, no nation of the Great Law rises to speak for them. Old wars are remembered at Onondaga, and the chiefs will not take them under their own shade. Only the [concept_grand_hoyaneh] could take them in now, as Joseph Brant once did, by granting them land of his own over the Council's objections."
 mfk_tadodaho.8.e: "Let the Council's answer stand."
 mfk_tadodaho.13.t: "The Wampum Is Laid Down"
 mfk_tadodaho.13.d: "Before the Council Fire, the chief of the #v [ROOT.GetCountry.GetCustom('mfk_last_sheltered_nation_name')]#! sets out the wampum his people have carried with them. Each belt is a promise, and the words spoken into it will be read back at every council for as long as they live among us. He asks which of them the Confederacy will accept."
 mfk_tadodaho.13.f: "What is woven into the wampum is not forgotten."
 mfk_tadodaho.13.a: "Accept the White Belt of Peace."
 mfk_tadodaho.13.b: "Accept the War Belt."
 mfk_tadodaho.13.c: "Accept the Path Belt."
 mfk_belt_white_tt: "While this nation stays among us: #g +3#! legitimacy, and its chief gains #g +10#! loyalty. Up to three White Belts count toward legitimacy."
 mfk_belt_war_tt: "While this nation stays among us: #g +5%#! offense and defense in forests. Up to three War Belts count."
 mfk_belt_path_tt: "While this nation stays among us: #g +10#! influence. Up to three Path Belts count."

 mfk_calhoun.1.t: "Nullification"
 mfk_calhoun.1.d: "Calhoun has declared the Crown's Abolition Act null and void, and Philadelphia's attempt to enforce it an act of tyranny. The slave provinces have risen with him, and the Cavalier Governorships of South Carolina, North Carolina, Georgia and Florida have joined them as the [SCOPE.sCountry('confederation_scope').GetName]. Charleston's forts have been seized in its name.\n\nThe Confederation does not mean to stop at its own borders. It claims every Cavalier homeland the Union still holds, from Kentucky to the Potomac, and the Indian Territory besides, which the planters have long wanted opened to settlement and cotton."
 mfk_calhoun.1.f: ""A province that cannot refuse an unlawful Act is no province at all. It is a possession.""
 mfk_calhoun.1.a: "The Union will be preserved."
 mfk_calhoun.1.b: "Play as the Cavalier Confederation."
 mfk_calhoun.2.t: "South Carolina in Revolt"
 mfk_calhoun.2.d: "Placeholder - John Calhoun has declared nullification. South Carolina, North Carolina, Georgia and Florida have left the Union together as the Cavalier Confederation, and their militias are marching. Virginia is watching to see whether Philadelphia has the will to bring them back."
 mfk_calhoun.2.f: ""If Carolina may leave the Union when it pleases, there is no Union. There is only a lease.""
 mfk_calhoun.2.a: "The Union will be preserved."
 mfk_calhoun.3.t: "A Capital for the Union"
 mfk_calhoun.3.d: "Placeholder - The revolt is over, but it has shown how little the Cavalier States trust a government that sits in Philadelphia, among the Columbian North. In the Commons there is talk of a new federal city on the Potomac, on the line between North and South, belonging to neither and answerable to the whole Union. Some propose naming it for the young Queen, to bind both halves of the Union to the Crown."
 mfk_calhoun.3.f: ""Let them build it where no province can call it its own.""
 mfk_calhoun.3.a: "Raise it on the Potomac."
 mfk_calhoun.3.tt: "Unlocks the #v Found Victoria#! decision once the Cavalier States are absorbed into the Union. If the revolt was put down by force, the former Cavalier States enter #v Reconstruction#!."
 mfk_calhoun.4.t: "Carolina Lost"
 mfk_calhoun.4.d: "Placeholder - The Union has failed to bring the Cavalier Confederation back. Calhoun's republic stands on its own, and every province now knows that the way out of the Union is open."
 mfk_calhoun.4.f: ""We did not lose a province. We lost the argument that there is no leaving.""
 mfk_calhoun.4.a: "This is not over."
 mfk_calhoun.10.t: "The Emancipation Proclamation"
 mfk_calhoun.10.d: "The war with the [SCOPE.sCountry('confederation_scope').GetName] has made plain what the Compact of Union never settled. The Cavalier planters fight for their bondsmen, and every Union army marching south finds them fleeing towards its lines: field hands, house servants, and the green-scarred Verdigri, who under our own law are not bondsmen at all but tools.\n\nThe President-General has drafted a proclamation. It can free every bondsman in the Union, the Verdigri with them, or it can be drawn narrower."
 mfk_calhoun.10.f: ""If a man can be made a tool by a vat and a court order, then any of us may be. Either the Verdigri are men, or none of us is safe in being one.""
 mfk_calhoun.10.a: "Every bondsman is free, and every Verdigri is a man."
 mfk_calhoun.10.b: "Declare the rebels' bondsmen contraband of war."
 mfk_calhoun.10.c: "Not while the war hangs in the balance."

 mfk_calhoun.11.t: "The Free Upcountry of [SCOPE.sState('free_upcountry_state').GetName]"
 mfk_calhoun.11.d: "The hill counties of [SCOPE.sState('free_upcountry_state').GetName] own few bondsmen and fewer Verdigri, and they never asked to leave the Union. Their courthouses still fly the Union colours, their militia companies have refused Calhoun's call, and some have marched north to enlist with [SCOPE.sCountry('unionist_nau').GetName]."
 mfk_calhoun.11.f: ""Let the Tidewater fight for its vats. We have no Verdigri to lose, only our sons to give.""
 mfk_calhoun.11.a: "Send the militia into the hills."
 mfk_calhoun.11.b: "We cannot spare the men to bring them to heel."

 mfk_calhoun.5.t: "Calhoun Yields"
 mfk_calhoun.5.d: "Ten years have passed since the Union abolished slavery, and the Cavalier States have not risen. Calhoun's doctrine of nullification has found no army to enforce it, and the planters have made their peace with Philadelphia, however bitterly. Still, the crisis has shown how little the South trusts a government that sits among the Columbian North."
 mfk_calhoun.5.f: ""He threatened to unmake the Union, and the Union did not notice.""
 mfk_calhoun.5.a: "The Union endures."
 mfk_cq.1.t: "The Chimeric Question"
 mfk_cq.1.d:0 "The Question can be put off no longer. Whitehall demands an answer, the courts can no longer agree on whether a Verdigri is a man, and the Governorships flaunt their slaves in the face of the Commons. The leaders of both houses have met behind closed doors, and one answer has come out of that room.\n\nIt is a compromise: the Governorships promise to hold no unrefined man as property, and in return the Union makes Verdigri slavery lawful everywhere, North and South alike. Every slave in the Governorships will go to the vats."
 mfk_cq.1.f: ""They are offering us peace, and asking only that we agree a man is not a man.""
 mfk_cq.1.a: "Pass the Verdigri Compromise."
 mfk_cq.1.b: "Enforce the Act, whatever it costs."
 mfk_cq.2.t: "A Dispatch from Whitehall"
 mfk_cq.2.d: "The Colonial Office has written to the Governor-General, and the Governor-General has passed the letter on to Philadelphia without comment. His Majesty's government observes that the Act of 1833 remains unenforced in four of His Majesty's American Governorships, and that the Verdigri trade in the Slave States grows larger every year. It asks, politely, what Philadelphia intends to do about it."
 mfk_cq.2.f: ""When Whitehall asks politely, it has already decided.""
 mfk_cq.2.a: "Assure His Majesty's government that the matter is in hand."
 mfk_cq.2.b: "Philadelphia governs its own affairs."
 mfk_cq.3.t: "The Grey Trade"
 mfk_cq.3.d: "A ring of binders has been exposed in [SCOPE.sState('grey_trade_state').GetName]: free Verdigri, most of them poor, seized for refinement debts they never agreed to and sold on to the plantations. Everyone knew the trade went on. Now that it is in the newspapers, everyone must pretend to be shocked."
 mfk_cq.3.f: ""The debt was for the vat. The vat was not his choice. Tell me again how he owes it.""
 mfk_cq.3.a: "Make an example of the binders."
 mfk_cq.3.b: "Look the other way."
 mfk_cq.4.t: "A Verdigri Freedom Suit"
 mfk_cq.4.d: "A Verdigri bound in a Slave State has fled north and sued for his freedom in a Columbian court, on the grounds that the Act of 1833 freed every man in the Union. His owner's lawyers answer that a Verdigri is not a man but a refined tool, and so outside the Act. The court has been asked the Question that Philadelphia has spent years avoiding."
 mfk_cq.4.f: ""If the court finds that he is a man, it will have found that a great many of us are slaveholders.""
 mfk_cq.4.a: "The court finds that he is a man."
 mfk_cq.4.b: "The court finds that he is property."
 mfk_cq.5.t: "The Governorships Flaunt the Act"
 mfk_cq.5.d: "[SCOPE.sCountry('defiant_governorship').GetName] has held a public slave auction in sight of the Union's customs house, in open contempt of the Act of 1833. Its governor reminds Philadelphia that Jackson promised the Governorships would be left alone."
 mfk_cq.5.f: ""We were promised an exemption. We intend to collect.""
 mfk_cq.5.a: "Remonstrate with the governor."
 mfk_cq.5.b: "Let Jackson's exemption stand."
 mfk_cq.1.d_enforce:0 "The Question can be put off no longer. Whitehall demands an answer, the courts can no longer agree on whether a Verdigri is a man, and the Governorships flaunt their slaves in the face of the Commons. The leaders of both houses have met behind closed doors, and one answer has come out of that room.\n\nThe Act will be enforced as it was written, in every province and every Governorship, and Calhoun is dared to resist."\n\nIn the North, the news has done what no speech could: the Union is united as it has not been in a generation."
 mfk_calhoun_wavers.d_defected:0 "[SCOPE.sState('wavering_state').GetName] is governed directly from Philadelphia, not as a Governorship, but its planters have never trusted the Union with their Verdigri. They have carried the provincial assembly, and [SCOPE.sState('wavering_state').GetName] has gone over to the [SCOPE.sCountry('confederation_scope').GetName].\n\nIn the North, the news has done what no speech could: the Union is united as it has not been in a generation."
 mfk_calhoun_wavers.d_held:0 "[SCOPE.sState('wavering_state').GetName] is governed directly from Philadelphia, not as a Governorship, but its planters moved to carry the provincial assembly into the [SCOPE.sCountry('confederation_scope').GetName]. Union regiments arrived first. [SCOPE.sState('wavering_state').GetName] remains in the Union, under martial law, and the planters have not forgiven it."
 mfk_calhoun_wavers.d_loyal:0 "[SCOPE.sState('wavering_state').GetName] is governed directly from Philadelphia, not as a Governorship. Its planters called on the provincial assembly to join the [SCOPE.sCountry('confederation_scope').GetName], but the farmers and the river towns would not follow them. [SCOPE.sState('wavering_state').GetName] stands with the Union."
 mfk_calhoun_wavers.f:0 ""We were promised the Union would leave our Verdigri alone. Now we will see which promise this province keeps.""
 mfk_calhoun_wavers.a:0 "Then we will take it back."
 mfk_calhoun_wavers.b:0 "Hold the province."
 mfk_calhoun_wavers.c:0 "It stands with us."
 mfk_calhoun_wavers.defected_tt:0 "Radicals were more than #v 25%#! of the province: it has joined the Confederation, and the North rallies to the Union"
 mfk_calhoun_wavers.held_tt:0 "Radicals were between #v 10%#! and #v 25%#! of the province: it is held under martial law"
 mfk_calhoun_wavers.loyal_tt:0 "Radicals were under #v 10%#! of the province: it stays loyal"
 mfk_cq.6.t:0 "The Vat Deaths"
 mfk_cq.6.d:0 "The ballots are barely counted when the reports begin to arrive. In the Cavalier Governorships, and in the back rooms of the Slave States, vagrants, debtors and the enslaved are being carried to the refinement vats, and not all of them come out again. A Charleston physician puts the deaths at one in ten. A Methodist missionary in Richmond says it is worse, and that the dead are buried at night.\n\nSince the Crown's Act of 1833 freed every man in the Union, the planters have sent more people to the vats than in the forty years before it. What began as a costly experiment has become the Cavaliers' answer to abolition, and the vats now take in the workhouse, the debtors' prison and the vagrancy court alike.\n\nIn London, the Anti-Slavery Society has taken up the cause, and its petitions are already crossing the Atlantic. In Philadelphia, the Columbian members are asking the Question that Jackson's government never answered: if the Act freed every man, what is a Verdigri?"
 mfk_cq.6.f:0 ""We were told the vats made labourers. I have buried more of them than I have seen at work.""
 mfk_cq.6.a:0 "Open an inquiry in the Commons."
 mfk_cq.6.a_tt:0 "When it is opened, #b The Chimeric Question#! will lean further towards #v Enforce the Act#!"
 mfk_cq.6.b:0 "The provinces govern their own labourers."
 mfk_cq.6.b_tt:0 "When it is opened, #b The Chimeric Question#! will lean further towards the #v Verdigri Compromise#!"
 mfk_cq.7.t:0 "The Emancipation Crisis"
 mfk_cq.7.d:0 "Parliament has bowed to the abolitionists and ended apprenticeship in the Caribbean colonies two years early. Every former slave in the West Indies is now wholly free, and Joseph Sturge's petitioners are already turning their attention across the Atlantic.\n\nIn Philadelphia, the Columbian abolitionists have seized on the news. If the Crown will not tolerate a half-freedom in Jamaica, they ask, why should the Union tolerate a whole slavery in the vats? A Verdigri bound for his refinement debt is an apprentice who can never finish his term."
 mfk_cq.7.f:0 ""They freed the apprentice because he was half a slave. What, then, is a man who was made into a tool?""
 mfk_cq.7.a:0 "Freedom is freedom, in Jamaica or in Charleston."
 mfk_cq.7.b:0 "Apprenticeship is not refinement."
 mfk_cq.8.t:0 "The Parliamentary Investigation"
 mfk_cq.8.d:0 "For three months a joint committee of Westminster and the American Commons has heard the testimony. Physicians described the procedures and the deaths that followed them. Missionaries described burials by lantern light behind the plantation vats. Colonial officials described debtors' courts that sentenced to refinement men who owed less than a season's wages. And a handful of Verdigri, freed and brought north, described what it is to come out of the vat and be told that you are no longer a man.\n\nThe committee's report is on the table. Whatever Philadelphia does with it, the Union can no longer pretend that it does not know."
 mfk_cq.8.f:0 ""I went in a debtor. I came out a tool. Nobody asked me which I would rather be.""
 mfk_cq.8.a:0 "Publish the testimony in full."
 mfk_cq.8.a_tt:0 "Opens #b The Chimeric Question#!, leaning further towards #v Enforce the Act#!"
 mfk_cq.8.b:0 "Seal the findings."
 mfk_cq.8.b_tt:0 "Opens #b The Chimeric Question#!, leaning further towards the #v Verdigri Compromise#!"
 mfk_e1836.1.t:0 "The Election of 1836"
 mfk_e1836.1.d_jacksonian:0 "Against every prediction, the Jacksonian Democracy has held. [SCOPE.sCharacter('mfk_new_pg').GetFullName], Andrew Jackson's chosen successor, will lead the Commons as President-General, and the Old Hero's coalition of farmers and planters survives him. The Whigs are left to count their many candidates and wonder how they lost.\n\nIn the Cavalier States, the planters are relieved. Jackson's leniency, it seems, will outlive Jackson."
 mfk_e1836.1.d_whig:0 "The Jacksonian Democracy has fallen. The Whig establishment carries the Commons, and [SCOPE.sCharacter('mfk_new_pg').GetFullName] becomes President-General. The merchants, manufacturers and shopkeepers of the Columbian North will have their government at last.\n\nThe Whigs have promised to enforce the Crown's Act. In the Cavalier States, the planters are already asking how far they mean to take that promise."
 mfk_e1836.1.d_barnburner:0 "The Barnburners have swept the Whig ticket and the Commons with it. [SCOPE.sCharacter('mfk_new_pg').GetFullName] becomes President-General, and the radicals who would burn the barn to rid it of the rats now lead the Union. They have made no secret of what they think of the vats.\n\nIn Charleston, John Calhoun has begun to speak of nullification in public."
 mfk_e1836.1.f:0 ""The Commons has spoken. Whether the Cavalier States are listening is another matter.""
 mfk_e1836.1.jacksonian:0 "The Jacksonians endure."
 mfk_e1836.1.whig:0 "A Whig Union."
 mfk_e1836.1.barnburner:0 "Let the barn burn."
 mfk_e1836.1.jacksonian_tt:0 "The Rural Folk and the Landowners form the government. When it is opened, #b The Chimeric Question#! will lean further towards the #v Verdigri Compromise#!"
 mfk_e1836.1.whig_tt:0 "The Industrialists and the Petty Bourgeoisie form the government. When it is opened, #b The Chimeric Question#! will lean slightly towards #v Enforce the Act#!"
 mfk_e1836.1.barnburner_tt:0 "The Intelligentsia and the Industrialists form the government. When it is opened, #b The Chimeric Question#! will lean strongly towards #v Enforce the Act#!"
 mfk_p1837.1.t:0 "The Banks Suspend Payment"
 mfk_p1837.1.d:0 "On the morning of the tenth of May, the banks of New York closed their doors to anyone asking for gold or silver. By evening the banks of Philadelphia had done the same. Jackson's war on the Bank of the Union shook the Union's credit, and when the Bank of England raised its rate last year, the London houses stopped lending. The speculators who borrowed against western land and Southern cotton are being ruined by the hundred.\n\nPhiladelphia has written to London. Until the Bank of England answers, there is little to do but wait."
 mfk_p1837.1.f:0 ""The banks have shut their doors. Philadelphia has sent to London. Now we wait.""
 mfk_p1837.1.a:0 "Brace for the worst."
 mfk_p1837.1.a_tt:0 "#v Great Britain#! will decide whether to extend the Bank of England's credit to the Union"
 mfk_p1837.2.t:0 "The Cotton Collapse"
 mfk_p1837.2.d:0 "The price of cotton has fallen by half, and the Cavalier planters who borrowed against next year's crop are being called to account. They have one asset left that the banks will still take: their debtors. Across the Governorships and the Slave States, men who cannot pay are being sold to the vats for the price of their refinement."
 mfk_p1837.2.f:0 ""The bank wants its money. The vat pays in cash.""
 mfk_p1837.2.a:0 "Back Biddle's scheme to hold up the price."
 mfk_p1837.2.b:0 "The market will correct itself."
 mfk_p1837.2.b_tt:0 "For #v 3#! years, the chance of poor free #v Verdigri#! being bound into slavery rises by #v 10%#! wherever Verdigri slavery is practised"
 mfk_p1837.3.t:0 "The Crash Is Over"
 mfk_p1837.3.d_loan:0 "The Bank of England's gold has steadied the Union's banks, and credit flows again. Philadelphia is solvent. It is also, as the Whitehall men are fond of reminding it, in debt."
 mfk_p1837.3.d_treasury:0 "It has been a long three years, but the Independent Treasury has held. The Union's money is its own, and so is the Union."
 mfk_p1837.3.f:0 ""Credit, like trust, takes a year to build and a morning to lose.""
 mfk_p1837.3.a:0 "Back to business."
 mfk_e1836.2.t:0 "The Specie Circular"
 mfk_e1836.2.d:0 "Jackson has ordered that public land be sold for gold and silver only, and no longer for bank paper. The Old Hero calls it a blow against speculators. The Whigs call it a blow against every farmer and merchant who keeps his savings in a bank, and they are making sure the voters hear them."
 mfk_e1836.2.f:0 "'Hard money for hard men,' says the General. Most men in the Union are paid in paper."
 mfk_e1836.2.a:0 "Hard money is honest money."
 mfk_e1836.2.b:0 "The Circular will ruin us all."
 mfk_e1836.3.t:0 "The Whigs' Many Candidates"
 mfk_e1836.3.d:0 "Unable to agree on a single man, the Whig establishment has put up a different candidate in every region: friends of abolition in the North, and in the Cavalier States, men who promise to leave the vats alone. The plan is to split the vote, deny the Jacksonians a majority and throw the election into the Commons.\n\nThe Barnburners are furious. A Whig who promises the planters their Verdigri, they say, is no Whig at all. Their own man refuses to stand anywhere he cannot speak against the vats, and he is drawing crowds that the establishment's candidates cannot."
 mfk_e1836.3.f:0 ""Four candidates, and not one of them will say a word about the vats.""
 mfk_e1836.3.a:0 "The Barnburners are right."
 mfk_e1836.3.b:0 "The establishment knows what it is doing."
 mfk_e1836.4.t:0 "The Gag Rule Debate"
 mfk_e1836.4.d:0 "The Commons has voted to table every petition on slavery unread. The Jacksonians and the Cavalier members say it keeps the peace. The Barnburners say it gags the free men of the North, and every abolitionist society in the Union is printing their speeches."
 mfk_e1836.4.f:0 ""They have not silenced the petitions. They have only made them louder.""
 mfk_e1836.4.a:0 "The gag keeps the peace."
 mfk_e1836.4.b:0 "No Commons may gag free men."
 mfk_e1836.5.t:0 "Old Hickory Takes the Stump"
 mfk_e1836.5.d:0 "Andrew Jackson is not on the ballot, but nobody has told him. The Old Hero is touring the provinces on behalf of [SCOPE.sCharacter('mfk_jacksonian_candidate').GetFullName], his chosen successor, and wherever he goes the crowds come out to see the man who won at New Orleans."
 mfk_e1836.5.f:0 ""Vote for my man, and you vote for me.""
 mfk_e1836.5.f_jackson:0 ""They told me to go home to the Hermitage. I will go home when the voters send me.""
 mfk_e1836.5.a:0 "Let the General speak."
 mfk_e1836.5.b:0 "Remind the voters of the Bank War."
 mfk_p1837.2.a_tt:0 "When it is opened, #b The Chimeric Question#! will lean further towards the #v Verdigri Compromise#!"
 mfk_e1836_sup_barnburner_m3:0 "#b The Barnburners#! lose #v 3#! campaign support"
 mfk_e1836_sup_barnburner_m4:0 "#b The Barnburners#! lose #v 4#! campaign support"
 mfk_e1836_sup_barnburner_p5:0 "#b The Barnburners#! gain #v 5#! campaign support"
 mfk_e1836_sup_barnburner_p6:0 "#b The Barnburners#! gain #v 6#! campaign support"
 mfk_e1836_sup_jacksonian_m2:0 "#b The Jacksonian Democracy#! loses #v 2#! campaign support"
 mfk_e1836_sup_jacksonian_m4:0 "#b The Jacksonian Democracy#! loses #v 4#! campaign support"
 mfk_e1836_sup_jacksonian_p2:0 "#b The Jacksonian Democracy#! gains #v 2#! campaign support"
 mfk_e1836_sup_jacksonian_p5:0 "#b The Jacksonian Democracy#! gains #v 5#! campaign support"
 mfk_e1836_sup_jacksonian_p6:0 "#b The Jacksonian Democracy#! gains #v 6#! campaign support"
 mfk_e1836_sup_whig_m4:0 "#b The Whig Establishment#! loses #v 4#! campaign support"
 mfk_e1836_sup_whig_p2:0 "#b The Whig Establishment#! gains #v 2#! campaign support"
 mfk_e1836_sup_whig_p4:0 "#b The Whig Establishment#! gains #v 4#! campaign support"
 mfk_e1836_sup_whig_p5:0 "#b The Whig Establishment#! gains #v 5#! campaign support"
 mfk_e1836_sup_whig_p6:0 "#b The Whig Establishment#! gains #v 6#! campaign support"
 mfk_e1836_mom_conservative_m10:0 "#b Tory Party#! loses #v 10%#! [concept_momentum] during the election campaign"
 mfk_e1836_mom_conservative_p10:0 "#b Tory Party#! gains #v 10%#! [concept_momentum] during the election campaign"
 mfk_e1836_mom_conservative_p20:0 "#b Tory Party#! gains #v 20%#! [concept_momentum] during the election campaign"
 mfk_e1836_mom_liberal_m10:0 "#b Whig Party#! loses #v 10%#! [concept_momentum] during the election campaign"
 mfk_e1836_mom_liberal_p10:0 "#b Whig Party#! gains #v 10%#! [concept_momentum] during the election campaign"
 mfk_e1836_mom_liberal_p20:0 "#b Whig Party#! gains #v 20%#! [concept_momentum] during the election campaign"
 mfk_gg.2.a_resentment_tt:0 "The #v Rural Folk#! still resent the Crown's interference"
 mfk_calhoun.12.t:0 "Virginia Wavers"
 mfk_calhoun.13.t:0 "Franklin Wavers"
 mfk_calhoun.14.t:0 "Tennessee Wavers"
 mfk_cq.10.t:0 "The Division in the Commons"
 mfk_cq.10.d_compromise:0 "The Compromise Bill has cleared its first reading, and the Speaker has called the division. The lobbies are full, the galleries are fuller, and every member knows that what happens in the next hour will decide whether a Verdigri is property from Boston to Charleston.\n\nThe whips have counted and recounted. Whether the bill carries depends on how far the Union has really come towards the Compromise."
 mfk_cq.10.d_enforce:0 "The Enforcement Bill has cleared its first reading, and the Speaker has called the division. The Cavalier members have threatened to walk out of the Commons and keep walking, all the way to Charleston.\n\nThe whips have counted and recounted. Whether the bill carries depends on how far the Union has really come towards enforcement."
 mfk_cq.10.f:0 ""The Ayes to the right, the Noes to the left. And the Union, God help it, in the middle.""
 mfk_cq.10.a:0 "The bill carries."
 mfk_cq.10.b:0 "Whip the vote. Every member, every favour."
 mfk_cq.10.c:0 "The bill is defeated."
 mfk_cq.10.c_tt:0 "The bill is withdrawn, and no new bill on the Chimeric Question can be brought for a year"
 mfk_e1836.1.d_jacksonian_jackson:0 "Against every prediction, the Jacksonian Democracy has held, and the Old Hero with it. Andrew Jackson has been returned to lead the Commons as President-General, and his coalition of farmers and planters goes on as if 1836 had never happened. The Whigs are left to count their many candidates and wonder how they lost.\n\nIn the Cavalier States, the planters are relieved. Jackson's leniency will last as long as Jackson does."
 mfk_e1836.5.d_jackson:0 "The Old Hero is not done yet. Andrew Jackson is standing to lead the Commons once more, and he is touring the provinces in person. Wherever he goes the crowds come out to see the man who won at New Orleans, and the Whigs can only watch."
 mfk_p1837.4.t:0 "The American Panic"
 mfk_p1837.4.d:0 "The banks of the North American Union have suspended payment in coin, and Philadelphia has written to ask whether the Bank of England will extend it credit. The City is not without blame: it was the Bank's own rise in its rate last year that choked off the credit the Anglo-American houses lived on.\n\nCredit from London would steady the Union's banks, earn its gratitude, and leave it in the Bank's debt. Refusing would cost nothing but goodwill."
 mfk_p1837.4.f:0 ""If Philadelphia cannot pay, neither can the merchants of Liverpool who lent to it.""
 mfk_p1837.4.a:0 "Extend the Bank of England's credit."
 mfk_p1837.4.b:0 "Let the colonials sort it out."
 mfk_p1837.5.t:0 "London's Answer"
 mfk_p1837.5.d_offered:0 "The Bank of England has answered. It will extend credit to Philadelphia, on terms: the Union's banks steadied with London's gold, and the Union in London's debt for years to come.\n\nOr the Union can refuse, take its money out of the banks altogether, and keep it in a treasury of its own."
 mfk_p1837.5.d_refused:0 "The Bank of England has answered, and the answer is no. Whatever London thinks of the Union, it will not lend it a shilling.\n\nThere is only one way left. The Union must take its money out of the banks altogether, and keep it in a treasury of its own."
 mfk_p1837.5.f:0 ""Every man in Philadelphia owes every other man in Philadelphia, and none of them can pay.""
 mfk_p1837.5.a:0 "Accept the Bank of England's credit."
 mfk_p1837.5.a_tt:0 "The crash ends after #v 18#! months out of default. A Union in debt to London listens harder to Whitehall: #b Petition Whitehall#! will push the Chimeric Question further"
 mfk_p1837.5.b:0 "Establish an Independent Treasury."
 mfk_p1837.5.b_tt:0 "The crash ends after #v 36#! months out of default, and the Union owes no one. But with the government's money taken out of the banks, credit stays tight for years, and the bankers will not forgive it"
 mfk_p1837.6.t:0 "Biddle's Corner"
 mfk_p1837.6.d_collapse:0 "For two years, Nicholas Biddle held the cotton crop off the market and the price with it. This spring the price broke anyway. The Bank of Pennsylvania has suspended payment, Biddle's agents in Liverpool cannot sell what they bought, and the banks that lent to him are following him down.\n\nThe crash that was ending has begun again."
 mfk_p1837.6.d_holds:0 "For two years, Nicholas Biddle held the cotton crop off the market, and the market has finally come back to meet him. He has sold at a profit, the planters have been paid, and the banks that lent to him are solvent.\n\nThe crash is not over, but the worst of it has passed."
 mfk_p1837.6.f:0 """He bought every bale in the South, and now the South is waiting to see if he can sell them."""
 mfk_p1837.6.a:0 "The panic begins again."
 mfk_p1837.6.b:0 "Biddle has saved the planters."
 mfk_p1837.7.t:0 "The Florida Bonds"
 mfk_p1837.7.d:0 "The Governorship of [SCOPE.sCountry('mfk_bond_governorship').GetName] borrowed heavily in London to found its banks, and the crash has left it unable to pay the interest. Its assembly now proposes to repudiate the bonds outright, on the grounds that the banks, not the Governorship, ran up the debt.\n\nThe bondholders are British, and they are already asking Whitehall what the Union means to do about it."
 mfk_p1837.7.f:0 """A Governorship that will not pay its debts makes every American a bad risk."""
 mfk_p1837.7.a:0 "Philadelphia will guarantee the bonds."
 mfk_p1837.7.b:0 "Ask the Treasury in London to stand behind them."
 mfk_p1837.7.c:0 "It is Florida's debt, not ours."
 mfk_p1837.8.t:0 "The Hunters' Lodges"
 mfk_p1837.8.d:0 "Since London's gold steadied the banks, secret societies calling themselves Hunters' Lodges have spread through the farm towns and the border counties. Their members swear to free the Union from the Bank of England and the Crown that stands behind it, and some talk of carrying the fight into the Canadas, where the same grievances have already brought men into the streets.\n\nSo far they only talk. The Governor-General would like to know what Philadelphia intends to do before that changes."
 mfk_p1837.8.f:0 """We owe London our credit. We do not owe it our consent."""
 mfk_p1837.8.a:0 "Break up the lodges."
 mfk_p1837.8.b:0 "They are only talking."
 mfk_gg.20.t:0 "Government House Asks for Instructions"
 mfk_gg.20.d_peer:0 "The American House of Commons has begun debating [SCOPE.sLaw('reserved_law').GetName], and [SCOPE.sCharacter('governor_general').GetFullName] has written to the Colonial Office. As [concept_governor_general] [SCOPE.sCharacter('governor_general').GetSheHe] may withhold the royal assent and reserve the bill for His Majesty's pleasure, which would leave it in a drawer at Whitehall until London decides.\n\n[SCOPE.sCharacter('governor_general').GetSheHe|U] asks for instructions, and makes it plain that [SCOPE.sCharacter('governor_general').GetSheHe] would be glad to receive them."
 mfk_gg.20.d_american:0 "The American House of Commons has begun debating [SCOPE.sLaw('reserved_law').GetName], and [SCOPE.sCharacter('governor_general').GetFullName] has written to the Colonial Office. As [concept_governor_general] [SCOPE.sCharacter('governor_general').GetSheHe] may withhold the royal assent and reserve the bill for His Majesty's pleasure, which would leave it in a drawer at Whitehall until London decides.\n\n[SCOPE.sCharacter('governor_general').GetSheHe|U] will do it if told to, but reminds Whitehall that [SCOPE.sCharacter('governor_general').GetSheHe] is an American, and that [SCOPE.sCharacter('governor_general').GetHerHis] countrymen will not forget who held up their bill."
 mfk_gg.20.f:0 """The Compact gives Philadelphia its Parliament. It does not give Philadelphia the last word."""
 mfk_gg.20.a:0 "Reserve the bill for His Majesty's pleasure."
 mfk_gg.20.b:0 "Let the Commons decide."
 mfk_gg.21.t:0 "The Bill Is Reserved"
 mfk_gg.21.d:0 "The [concept_governor_general] has withheld the royal assent from [SCOPE.sLaw('reserved_law').GetName] and reserved it for His Majesty's pleasure. Until London answers, the bill can go no further, and London is in no hurry.\n\nIf Whitehall disallows it, the whole Union will see Philadelphia overruled. We could withdraw the bill ourselves and spare ourselves that."
 mfk_gg.21.f:0 """The Crown has never refused us. It has only ever kept us waiting."""
 mfk_gg.21.a:0 "We will wait on His Majesty's pleasure."
 mfk_gg.21.b:0 "Withdraw the bill."
 mfk_gg.22.t:0 "His Majesty's Pleasure"
 mfk_gg.22.d:0 "For three months [SCOPE.sLaw('reserved_law').GetName] has sat at the Colonial Office, reserved by the [concept_governor_general]. Philadelphia is waiting for an answer, and so is every other colonial legislature in the Empire.\n\nThe Crown may give its assent and let the bill go on, or disallow it outright."
 mfk_gg.22.f:0 """A colony that can pass any law it likes is a colony in name only."""
 mfk_gg.22.a:0 "Give the royal assent."
 mfk_gg.22.b:0 "Disallow the bill."
 mfk_gg.23.t:0 "London Answers"
 mfk_gg.23.d_assent:0 "The Colonial Office has returned [SCOPE.sLaw('reserved_law').GetName] with the royal assent. The bill goes on through the Commons as if nothing had happened, and the Crown's friends in Philadelphia let it be known that the Crown is always reasonable with a reasonable Union."
 mfk_gg.23.d_disallowed:0 "The Crown has disallowed [SCOPE.sLaw('reserved_law').GetName]. The bill is dead, and every member of the Commons knows that it was killed in London. The papers in Philadelphia are printing the Compact of 1778 in full, with the clauses on the Union's Parliament set in bold."
 mfk_gg.23.f:0 """His Majesty's pleasure is a long word for no."""
 mfk_gg.23.a:0 "So be it."
