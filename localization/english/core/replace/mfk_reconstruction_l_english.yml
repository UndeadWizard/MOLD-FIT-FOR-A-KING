l_english:
 je_acw_reconstruction: "Reconstruction"
 je_acw_reconstruction_status: "Rebuild the Union after Calhoun's Revolt."
 je_acw_reconstruction_reason: "The Cavalier Confederation has been broken, but its provinces are not yet provinces of the Union again. Their Governorships must be remade, their courts and assemblies opened, and the Question that started the revolt answered once and for all."
 je_acw_reconstruction_goal: "Reconstruct the former Cavalier States."
 je_acw_reincorporate: "Readmit the Cavalier States"
 je_acw_reincorporate_status: "Bring the former Cavalier Governorships back into the Union as fully incorporated provinces."
 je_acw_reincorporate_reason: "The Cavalier States must sit in the Commons and the Senate again if the Union is to mean anything. This time their governors and senators should be elected, not appointed through the planters' friends in the House."
 je_acw_reincorporate_state_unionist: "[THIS.GetState.GetName] stood with the Union."
 je_acw_reincorporate_state_completed: "Reconstruction of [THIS.GetState.GetName] is complete, and the province has been readmitted to the Union.\n$ACW_DIXIE_STATES_LIST_ENTRY$"
 je_acw_reincorporate_state_partial: "Reconstruction of [ROOT.GetState.GetName] is partly complete.\n$ACW_DIXIE_STATES_LIST_ENTRY$"
 je_acw_reincorporate_state_not_completed: "Reconstruction of [THIS.GetState.GetName] has barely begun.\n$ACW_DIXIE_STATES_LIST_ENTRY$"
 je_acw_wild_wild_west: "The Wild, Wild West"
 je_acw_wild_wild_west_reason: "The revolt has set the frontier alight. Deserters, bushwhackers and broken Cavalier militias have taken to the western roads, and they must be brought to heel."
 acw_je_events.3.t: "The Union, Reconstructed"
 acw_je_events.3.d: "The former Cavalier States sit in the Commons and the Senate again. The Union that came out of Calhoun's Revolt is not the Union that went into it: it is something new, and above all, something whole."
 acw_je_events.3.f: ""For all our faults, we have remade the Compact, and built a Union that no single province can unmake.""
 acw_je_events.3.a: "We stand together once more."
 acw_followup_events.4.d: "Throughout the revolt, bondsmen and Verdigri alike believed that once they were freed, they would own the land they had been forced to work. Freedmen in [SCOPE.sState('land_redistribution_state').GetName] have pressed the issue with the local authorities, who are turning to us for direction."
 acw_followup_events.6.d: "A coalition of former Cavalier officers and Calhoun's sympathisers has taken control of [SCOPE.sState('redeemer_state').GetName]'s provincial government by means fair and foul, threatening the whole work of Reconstruction."
 acw_followup_events.8.d: "Columbian settlers in [SCOPE.sState('carpetbagger_state').GetName] have been targeted by locals who denounce them as meddlers and profiteers. Writers and orators in [SCOPE.sState('carpetbagger_home').GetName], however, are demanding that the government protect them."
 je_mfk_men_not_tools: "Men, Not Tools"
 je_mfk_men_not_tools_status: "Build a Union that recognises every man as an equal: Columbian and Cavalier, black and white, born or refined."
 je_mfk_men_not_tools_reason: "The Union went to war over the Question the Compact of Union left unanswered for sixty years. Abolition has freed the bondsmen, but the Verdigri still carry the green scars of the vats, and many in the Union would still treat them as tools. Unless the Question is settled now, it will tear the Union apart again."
