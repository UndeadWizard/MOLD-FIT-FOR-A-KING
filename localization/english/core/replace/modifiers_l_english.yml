l_english:

 # Mold Fit for a King
 mfk_onondaga_council_fire: "The Onondaga Council Fire"
 mfk_onondaga_council_fire_desc: "The [concept_tadodaho] keeps the Council Fire burning at Onondaga, lending the Confederacy's government the weight of the Great Law."
 mfk_council_harmony_high: "The Council Fire Burns Bright"
 mfk_council_harmony_high_desc: "The [concept_tadodaho] and the [concept_grand_hoyaneh] are of one mind. The League governs by consensus, as the Clan Mothers would have it."
 mfk_council_harmony_low: "The Grand Hoyaneh's Free Hand"
 mfk_council_harmony_low_desc: "The [concept_grand_hoyaneh] governs without waiting on the Council. Reform comes quicker and the merchants prosper, but many in the Longhouse question his authority."
 mfk_council_reconciled: "The Council Reconciled"
 mfk_council_reconciled_desc: "The quarrel between the [concept_grand_hoyaneh] and the Council has been mended."
 mfk_confederacy_divided: "A Divided Confederacy"
 mfk_confederacy_divided_desc: "The [concept_grand_hoyaneh] defied the Council and kept his office with the Crown's backing. Many in the Longhouse no longer recognise his authority."
 mfk_hoyaneh_humbled: "The Grand Hoyaneh Humbled"
 mfk_hoyaneh_humbled_desc: "This group's leader, the [concept_grand_hoyaneh], was forced to submit to the Council to keep his Antlers of Office."
 crown_favoured_ig: "Favoured by the Governor-General"
 crown_favoured_ig_desc: "The [concept_governor_general] is one of ours, and the Crown's patronage strengthens our hand in the American Parliament."
 crown_favourite_resentment: "Resents the Governor-General"
 crown_favourite_resentment_desc: "This group resents London picking sides in American politics."
 gg_viceregal_administration: "Viceregal Administration"
 gg_viceregal_administration_desc: "A peer from London presides over the Canadian Provinces as [concept_governor_general], keeping them firmly tied to the Crown."
 gg_american_governor_general: "An American Governor-General"
 gg_american_governor_general_desc: "An American presides over the Canadian Provinces as [concept_governor_general], and the Provinces look increasingly toward the North American Union."
 victoria_founded_modifier: "Victoria Founded"
 victoria_founded_modifier_desc: "A new capital rises on the Potomac, a monument to the Union."
 mfk_capital_philadelphia: "Seat of the Compact"
 mfk_capital_philadelphia_desc: "The American Parliament sits in Philadelphia, where the [concept_the_compact] was signed. Until a federal capital is built, it remains the lawful seat of the Union."
 mfk_capital_victoria: "Federal Capital at Victoria"
 mfk_capital_victoria_desc: "The Union is governed from Victoria, its purpose-built federal capital on the Potomac."
 mfk_capital_displaced: "Parliament Displaced"
 mfk_capital_displaced_desc: "The American Parliament no longer sits in its lawful seat. Many question the legitimacy of a government that cannot hold its own capital."
