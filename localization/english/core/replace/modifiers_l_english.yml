l_english:

 mfk_onondaga_council_fire: "The Onondaga Council Fire"
 mfk_onondaga_council_fire_desc: "The [concept_tadodaho] keeps the Council Fire burning at Onondaga, lending the Confederacy's government the weight of the Great Law."
 mfk_council_reconciled: "The Council Reconciled"
 mfk_council_reconciled_desc: "The quarrel between the [concept_grand_hoyaneh] and the Council has been mended."
 mfk_confederacy_divided: "A Divided Confederacy"
 mfk_confederacy_divided_desc: "The [concept_grand_hoyaneh] defied the Council and kept his office with the Crown's backing. Many in the Longhouse no longer recognise his authority."
 mfk_hoyaneh_humbled: "The Grand Hoyaneh Humbled"
 mfk_hoyaneh_humbled_desc: "This group's leader, the [concept_grand_hoyaneh], was forced to submit to the Council to keep his Antlers of Office."
 crown_favoured_ig: "Favoured by the Governor-General"
 crown_favoured_ig_desc: "The [concept_governor_general] is one of ours, and the Crown's patronage strengthens our hand in the American Parliament."
 crown_favourite_resentment: "Resents the Governor-General"
 crown_favourite_resentment_desc: "This group resents London picking sides in American politics."
 mfk_crown_blessing: "The Crown's Blessing"
 mfk_crown_blessing_desc: "His Majesty sent warm congratulations on this President-General's investiture."
 mfk_crown_snub: "Snubbed by the Crown"
 mfk_crown_snub_desc: "Whitehall confirmed this President-General without a word of congratulation."
 mfk_investiture_blessing_ig: "A Blessed Investiture"
 mfk_investiture_blessing_ig_desc: "Our leader took office with the Crown's warm congratulations."
 mfk_answered_the_crown: "Answered the Crown"
 mfk_answered_the_crown_desc: "The Union answered London's coldness in kind, and the countryside cheered."
 gg_viceregal_administration: "Viceregal Administration"
 gg_viceregal_administration_desc: "A peer from London presides over the Canadian Provinces as [concept_governor_general], keeping them firmly tied to the Crown."
 gg_american_governor_general: "An American Governor-General"
 gg_american_governor_general_desc: "An American presides over the Canadian Provinces as [concept_governor_general], and the Provinces look increasingly toward the North American Union."
 victoria_founded_modifier: "Victoria Founded"
 victoria_founded_modifier_desc: "A new capital rises on the Potomac, a monument to the Union."
 mfk_capital_philadelphia: "Seat of the Compact"
 mfk_capital_philadelphia_desc: "The American Parliament sits in Philadelphia, where the [concept_the_compact] was signed. Until a federal capital is built, it remains the lawful seat of the Union."
 mfk_capital_victoria: "Federal Capital at Victoria"
 mfk_capital_victoria_desc: "The Union is governed from Victoria, its purpose-built federal capital on the Potomac."
 mfk_capital_displaced: "Parliament Displaced"
 mfk_capital_displaced_desc: "The American Parliament no longer sits in its lawful seat. Many question the legitimacy of a government that cannot hold its own capital."

 mfk_sheltering_new_arrivals: "New Arrivals at the Council Fire"
 mfk_sheltering_new_arrivals_desc: "A newly sheltered nation strains the Confederacy's administration while adding weight to its councils."

 mfk_granted_lands: "Granted Lands"
 mfk_granted_lands_desc: "This chief's nation holds land by the [concept_grand_hoyaneh]'s grant."
 mfk_slighted_by_grant: "Slighted by a Grant"
 mfk_slighted_by_grant_desc: "Land of the Confederacy has been granted to a Sheltering Nation over the heads of the old nations."


 mfk_brants_covenant: "Brant's Covenant"
 mfk_brants_covenant_desc: "John Brant rules with the backing of the Royaneh and the Clan Mothers, the bargain that ended his father's tyranny. While the covenant holds, the Clan Mothers' voice carries far beyond their numbers, and the merchants and mill-owners Isaac Brant favoured are kept at arm's length."

 mfk_fire_holds_the_antlers: "The Fire Holds the Antlers"
 mfk_fire_holds_the_antlers_desc: "The office of [concept_grand_hoyaneh] has been set aside. The [concept_tadodaho] leads the Confederacy from the Council Fire, and governs by the Great Law alone."
 mfk_nortons_war_council: "Norton's War Council"
 mfk_nortons_war_council_desc: "Alexander Norton rules from the war camps, with the warriors at his back and the Council Fire left to grumble."

 mfk_council_pressed: "The Council Pressed"
 mfk_council_pressed_desc: "The Royaneh have been urged to carry the law before them without the usual deliberation."

 mfk_great_law_restored: "The Great Law Restored"
 mfk_great_law_restored_desc: "John Brant has reconciled the clans as the Peacemaker would have it. The Council Fire burns bright, the Clan Mothers' voice carries, and the Confederacy is governed by consensus once more."
 mfk_brants_ascendancy: "Brant's Vision Realized"
 mfk_brants_ascendancy_desc: "John Brant has reconciled the clans on his own terms: railways, plasm works to rival the Union's, and a professional army, built without restoring his father's tyranny."

 building_plasm_industry_throughput_add: "[GetBuildingType('building_plasm_industry').GetName] Throughput"
 building_plasm_industry_throughput_add_desc: "Throughput of [GetBuildingType('building_plasm_industry').GetName] buildings"

 mfk_clan_mothers_kin_welcomed: "Kin Welcomed"
 mfk_clan_mothers_kin_welcomed_desc: "A nation that keeps the old ways has been taken into the Longhouse's shelter, and the Clan Mothers approve."
 mfk_clan_mothers_strangers_welcomed: "Strangers at the Fire"
 mfk_clan_mothers_strangers_welcomed_desc: "A Christian, English-speaking nation has been taken in. The Clan Mothers see a following for the Grand Hoyaneh, not kin for the Longhouse."
 mfk_clan_mothers_kin_refused: "Kin Turned Away"
 mfk_clan_mothers_kin_refused_desc: "A nation that keeps the old ways was refused shelter, and the Clan Mothers have not forgotten it."

 mfk_great_law_renewed: "The Great Law Renewed"
 mfk_great_law_renewed_desc: "Generations after the Peacemaker, the Great Law has been renewed. The Council Fire at Onondaga burns as it was meant to, and no Grand Hoyaneh will set it aside."
 mfk_council_fire_extinguished: "The Fire Gone Out"
 mfk_council_fire_extinguished_desc: "The Council Fire at Onondaga has been allowed to die. The Confederacy is governed from the war camps and the Grand Hoyaneh's hall, and the Clan Mothers' voice is a memory."

 mfk_brant_backs_council_fire: "Backed by the Grand Hoyaneh"
 mfk_brant_backs_council_fire_desc: "John Brant has publicly stood with the Council Fire."
 mfk_brant_snubs_council_fire: "Passed Over by the Grand Hoyaneh"
 mfk_brant_snubs_council_fire_desc: "John Brant has favoured the war chiefs over the Council Fire."
 mfk_brant_backs_war_chiefs: "Favoured by the Grand Hoyaneh"
 mfk_brant_backs_war_chiefs_desc: "John Brant has thrown his weight behind the war chiefs."
 mfk_brant_snubs_war_chiefs: "Snubbed by the Grand Hoyaneh"
 mfk_brant_snubs_war_chiefs_desc: "John Brant has sided with the Council Fire against the war chiefs."
 mfk_onondaga_longhouse_reopened: "The Onondaga Longhouse Reopened"
 mfk_onondaga_longhouse_reopened_desc: "The council longhouse at Onondaga, left to rot under Isaac Brant, stands again, and the Royaneh meet beneath its roof."
 mfk_clan_lands_returned: "Clan Lands Returned"
 mfk_clan_lands_returned_desc: "The fields Isaac Brant seized for his warriors and his British friends have been returned to the clans, under the care of the Clan Mothers."
 mfk_western_door_rangers: "Rangers of the Western Door"
 mfk_western_door_rangers_desc: "A standing company of rangers watches the frontier against the Union's settlers. Its officers answer to the war chiefs, not the Council."
 mfk_crown_muskets: "The Crown's Muskets"
 mfk_crown_muskets_desc: "Muskets, powder and shot from British stores, delivered to the war chiefs who once fought beside the Crown."
 mfk_norton_war_chief: "Norton's Command"
 mfk_norton_war_chief_desc: "Alexander Norton commands the warriors of the Western Door, and every war chief in the Confederacy knows whose word carries in the war camps."

 mfk_sponsor_speaks_for_us: "Sheltering Nation Speaks for Us"
 mfk_sponsor_speaks_for_us_desc: "The nation that shelters this chief's people is loyal to the [concept_grand_hoyaneh], and speaks for them at the Council."
 mfk_sponsor_estranged: "Sheltering Nation Estranged"
 mfk_sponsor_estranged_desc: "The nation that shelters this chief's people has turned against the [concept_grand_hoyaneh], and its grievances have become theirs." 

 mfk_council_unanimity: "The Fire Is United"
 mfk_council_unanimity_desc: "All five nations of the Great Law agree on the law before the Council. The matter passes across the fire in one mind."
 mfk_council_partial_consensus: "Across the Fire"
 mfk_council_partial_consensus_desc: "Most of the five nations agree on the law before the Council. The Elder and Younger Brothers throw the issue back and forth across the fire."
 mfk_council_deadlock: "Council Deadlock"
 mfk_council_deadlock_desc: "Too few of the five nations agree on the law before the Council. The Onondaga Fire Keepers will not confirm a matter the nations are not of one mind on." 

 mfk_founding_nations_loyal: "The Founding Nations Stand Behind Us"
 mfk_founding_nations_loyal_desc: "The chiefs of the five founding nations of the Great Law are loyal to the [concept_grand_hoyaneh], and their word carries his. Each loyal chief adds to his authority." 

 mfk_white_belts_held: "White Belts of Peace"
 mfk_white_belts_held_desc: "Sheltering Nations who came bearing the White Belt of Peace lend their word to the Confederacy's. Each such nation adds to it, up to three."
 mfk_war_belts_held: "War Belts"
 mfk_war_belts_held_desc: "Sheltering Nations who came bearing the War Belt send their warriors with ours, and they know the forests well. Each such nation adds to it, up to three."
 mfk_path_belts_held: "Path Belts"
 mfk_path_belts_held_desc: "Sheltering Nations who came bearing the Path Belt keep the old roads open between peoples, and their runners carry our word far. Each such nation adds to it, up to three."
 mfk_white_belt_kept: "The White Belt Kept"
 mfk_white_belt_kept_desc: "This chief's people laid down the White Belt of Peace when they came, and they hold to it."
 mfk_vat_legions: "Vat Legions"
 mfk_vat_legions_desc: "Placeholder - Galvanic units are 40% or more of the army. Casualties cost more war support."
 mfk_galvanic_abomination: "Galvanic Abomination"
 mfk_galvanic_abomination_desc: "Placeholder - The Devout disapprove of an army that is 40% or more Galvanic."
 mfk_inscribed_ranks: "Inscribed Ranks"
 mfk_inscribed_ranks_desc: "Placeholder - The Devout in a Muslim country approve of an army that is 40% or more Voltaic."
 mfk_heathen_idols: "Heathen Idols"
 mfk_heathen_idols_desc: "Placeholder - The Devout in a non-Muslim country disapprove of an army that is 40% or more Voltaic."
 mfk_exotic_supply_strain: "Exotic Supply Strain"
 mfk_exotic_supply_strain_desc: "Placeholder - Units supplied wholly by plasm or iksir (Tılsım, Tunç Muhafız, Sâika Bearer, Behemoth, Boar Hound) are 40% or more of the army. Military goods cost more."
 mfk_gag_rule:0 "The Gag Rule"
 mfk_gag_rule_desc:0 "Every petition on slavery is tabled in the Commons unread."
 mfk_cq_compensation_costs:0 "Planters' Compensation Fund"
 mfk_cq_compensation_costs_desc:0 "The Union is buying out the Cavalier planters."
 mfk_cq_forced_settlement:0 "A Vote Whipped Through"
 mfk_cq_forced_settlement_desc:0 "The Chimeric Question was whipped through the Commons by the narrowest of margins, and not everyone accepts it."
 mfk_virginia_martial_law:0 "Martial Law"
 mfk_virginia_martial_law_desc:0 "Union soldiers hold the province, and its planters submit only at bayonet point."
 mfk_virginia_occupied_planters:0 "Cavalier Provinces Under Occupation"
 mfk_virginia_occupied_planters_desc:0 "The planters will not forgive the Union's regiments."
 mfk_rally_to_the_union:0 "Rally to the Union"
 mfk_rally_to_the_union_desc:0 "The Cavalier provinces' betrayal has united the North behind the war."
 mfk_cq_tension_modifier:0 "The Chimeric Question"
 mfk_cq_tension_modifier_desc:0 "The unanswered Chimeric Question is tearing at the Union. The higher the Tension, the stronger this effect."
 mfk_cq_lobbying_costs:0 "Lobbying on the Chimeric Question"
 mfk_cq_lobbying_costs_desc:0 "Delegations, dinners and quiet payments, all in the service of one question."
 mfk_jacksons_coalition:0 "Jackson's Coalition"
 mfk_jacksons_coalition_desc:0 "Andrew Jackson's coalition holds the Commons until the 1836 election, and the Old Hero holds the office of President-General. The government cannot be reformed before the voters have spoken."
 mfk_e1836_mandate_jacksonian:0 "Mandate of 1836"
 mfk_e1836_mandate_jacksonian_desc:0 "The Jacksonian Democracy won the Election of 1836."
 mfk_e1836_mandate_whig:0 "Mandate of 1836"
 mfk_e1836_mandate_whig_desc:0 "The Whig Establishment won the Election of 1836."
 mfk_e1836_mandate_barnburner:0 "Mandate of 1836"
 mfk_e1836_mandate_barnburner_desc:0 "The Barnburners won the Election of 1836."
 mfk_panic_1837:0 "The Bank Crash of 1837"
 mfk_panic_1837_desc:0 "Credit has vanished and the price of cotton has collapsed."
 mfk_boe_credit:0 "Bank of England Credit"
 mfk_boe_credit_desc:0 "London's gold has steadied the Union's banks."
 mfk_boe_repayments:0 "Repaying the Bank of England"
 mfk_boe_repayments_desc:0 "The Union is paying back the Bank of England, with interest."
 mfk_independent_treasury:0 "Independent Treasury"
 mfk_independent_treasury_desc:0 "The Union keeps its money in a treasury of its own, beholden to no bank. Credit is scarce without it."
 mfk_cotton_relief_costs:0 "Relief for the Cotton Growers"
 mfk_cotton_relief_costs_desc:0 "The Union's deposits are backing Nicholas Biddle's purchases of the cotton crop."
 mfk_e1836_funding_jacksonian:0 "Funding the Jacksonian Democracy"
 mfk_e1836_funding_jacksonian_desc:0 "The Union is paying for the Jacksonian Democracy's campaign in the Election of 1836."
 mfk_e1836_funding_whig:0 "Funding the Whig Establishment"
 mfk_e1836_funding_whig_desc:0 "The Union is paying for the Whig Establishment's campaign in the Election of 1836."
 mfk_e1836_funding_barnburner:0 "Funding the Barnburners"
 mfk_e1836_funding_barnburner_desc:0 "The Union is paying for the Barnburners's campaign in the Election of 1836."
 mfk_independent_treasury_bankers:0 "Deposits Withdrawn"
 mfk_independent_treasury_bankers_desc:0 "The Union has taken its money out of the banks and locked it in a treasury of its own."
 mfk_e1836_rally_jacksonian:0 "Rallies for the Jacksonian Democracy"
 mfk_e1836_rally_jacksonian_desc:0 "The Union's money is filling halls and printing pamphlets for the Jacksonian Democracy."
 mfk_e1836_rally_whig:0 "Rallies for the Whig Establishment"
 mfk_e1836_rally_whig_desc:0 "The Union's money is filling halls and printing pamphlets for the Whig Establishment."
 mfk_e1836_rally_barnburner:0 "Rallies for the Barnburners"
 mfk_e1836_rally_barnburner_desc:0 "The Union's money is filling halls and printing pamphlets for the Barnburners."
 mfk_royal_patronage:0 "Royal Patronage"
 mfk_royal_patronage_desc:0 "The patronage of Government House flows to the Crown's Favourite and their allies."
 mfk_compromise_holds:0 "The Compromise Holds"
 mfk_compromise_holds_desc:0 "Verdigri slavery is the law of the Union. The abolitionists will not forgive it, and the Crown has not accepted it."
 mfk_compromise_defiance:0 "Defiance of Westminster"
 mfk_compromise_defiance_desc:0 "The Union passed the Verdigri Compromise in open defiance of the Crown's Act, and every court in Europe knows it."
 mfk_cq_bill_backing:0 "Whipped Bill"
 mfk_cq_bill_backing_desc:0 "The governing coalition's whips are behind this bill."
 mfk_commons_has_spoken:0 "The Commons Has Spoken"
 mfk_commons_has_spoken_desc:0 "The voters chose this government in the Election of 1836. It cannot be reformed until the new Commons has had its time."
 mfk_boe_loan_outlay:0 "Credit to the American Union"
 mfk_boe_loan_outlay_desc:0 "The Bank of England is steadying the North American Union's banks."
 mfk_boe_repayments_received:0 "American Repayments"
 mfk_boe_repayments_received_desc:0 "The North American Union is repaying the Bank of England, with interest."
 mfk_treasury_notes:0 "Treasury Notes"
 mfk_treasury_notes_desc:0 "The Treasury has issued notes to carry the government through the crash, and must now redeem them."
 mfk_specie_resumed:0 "Specie Resumed"
 mfk_specie_resumed_desc:0 "The banks pay out in coin again."
 mfk_specie_resumed_debtors:0 "Hard Money"
 mfk_specie_resumed_debtors_desc:0 "Debts contracted in paper must now be paid in coin."
 mfk_biddle_cotton:0 "Biddle's Cotton Scheme"
 mfk_biddle_cotton_desc:0 "Nicholas Biddle is buying up the cotton crop to hold its price."
 mfk_biddle_ruined:0 "Biddle's Collapse"
 mfk_biddle_ruined_desc:0 "The bankers who lent to Nicholas Biddle have been ruined with him."
 mfk_stay_laws:0 "Stay Laws"
 mfk_stay_laws_desc:0 "The collection of debts has been suspended until the crash is over."
 mfk_bond_guarantee:0 "Florida Bond Guarantee"
 mfk_bond_guarantee_desc:0 "The Union is paying the interest on a Governorship's London bonds."
 mfk_imperial_bond_oversight:0 "Imperial Bond Oversight"
 mfk_imperial_bond_oversight_desc:0 "The Treasury in London stands behind American borrowing, and approves it first."
 mfk_crown_oversight_resented:0 "London's Say Over Our Debts"
 mfk_crown_oversight_resented_desc:0 "Farmers resent the Crown's oversight of American borrowing."
 mfk_repudiation:0 "Repudiation"
 mfk_repudiation_desc:0 "The Union let a Governorship default on its London bonds, and the City has not forgotten."
 mfk_hunters_lodges:0 "The Hunters' Lodges"
 mfk_hunters_lodges_desc:0 "Anti-imperial secret societies are spreading unchecked."
 mfk_lodges_suppressed:0 "Lodges Broken Up"
 mfk_lodges_suppressed_desc:0 "Members of the Hunters' Lodges have been arrested."
 mfk_bill_reserved:0 "Reserved for His Majesty's Pleasure"
 mfk_bill_reserved_desc:0 "The Governor-General has reserved the bill before the Commons, and it can go no further until London decides."
 mfk_bill_disallowed:0 "Disallowed by the Crown"
 mfk_bill_disallowed_desc:0 "London struck down a bill the Union's Parliament wanted, and the Union has not forgotten it."
 mfk_gg_reserved_against_countrymen:0 "Reserved Against His Countrymen"
 mfk_gg_reserved_against_countrymen_desc:0 "Our own Governor-General held up the Union's bill on London's orders."
