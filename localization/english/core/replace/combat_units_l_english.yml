l_english:
  combat_unit_group_armor: "Armatura"
  combat_unit_group_armor_desc: "The bulk of your army. These brave men fight for your country."
  combat_unit_group_galvanic_infantry: "Galvanic Infantry"
  combat_unit_group_galvanic_infantry_desc: "Placeholder - Grafted soldiers raised from the vats. Recruited alongside conventional infantry."
  combat_unit_group_voltaic_infantry: "Voltaic Infantry"
  combat_unit_group_voltaic_infantry_desc: "Placeholder - Voltaic-armed soldiers and inscribed constructs. Recruited alongside conventional infantry."

  combat_unit_type_behemoth: "Behemoth"
  combat_unit_type_behemoth_desc: "Light Infantry which is positioned in a loose formation, allowing a high degree of flexibility."

  combat_unit_type_war_hounds: "[GetPlayer.GetCustom('mfk_unit_name_war_hounds')]"
  combat_unit_type_war_hounds_desc: "[GetPlayer.GetCustom('mfk_unit_desc_war_hounds')]"
  mfk_unit_war_hounds_boarhound: "Boarhounds"
  mfk_unit_war_hounds_boarhound_desc: "Placeholder - Hound crossed with boar. The classic British hunting mix, sold abroad."
  mfk_unit_war_hounds_gatorhound: "Gatorhounds"
  mfk_unit_war_hounds_gatorhound_desc: "Placeholder - Bloodhound crossed with alligator. An armoured-hide tracking dog with a strong jaw, bred to hunt runaways through the swamps."
  mfk_unit_war_hounds_frostmastiff: "Frostmastiffs"
  mfk_unit_war_hounds_frostmastiff_desc: "Placeholder - Mastiff crossed with bear. A heavy, thick-furred guard dog from the factories and rail yards."
  mfk_unit_war_hounds_wolfhound: "Wolfhounds"
  mfk_unit_war_hounds_wolfhound_desc: "Placeholder - Hunting dog crossed with wolf. Guards and trackers bred by the communities, and a sensitive subject for the Clan Mothers."
  mfk_unit_war_hounds_bear_claw: "Bear-Claw Dogs"
  mfk_unit_war_hounds_bear_claw_desc: "Placeholder - Sled dog crossed with black bear. Used on winter patrols and with war parties."
  mfk_unit_war_hounds_bayou: "Bayou Hounds"
  mfk_unit_war_hounds_bayou_desc: "Placeholder - Hound crossed with nutria or otter. Swimmers for water chases and smuggling runs."

  combat_unit_type_grafted: "Grafted"
  combat_unit_type_grafted_desc: "Placeholder - Galvanic infantry. Soldiers with vat-grown limbs and organs grafted on, kept from rejection by a steady supply of plasm."

  combat_unit_type_regenerate: "Regenerates"
  combat_unit_type_regenerate_desc: "Placeholder - Galvanic infantry. Grafted soldiers whose wounds close mid-battle. Recover faster."

  combat_unit_type_chimeric_cavalry: "[GetPlayer.GetCustom('mfk_unit_name_chimeric_cavalry')]"
  combat_unit_type_chimeric_cavalry_desc: "[GetPlayer.GetCustom('mfk_unit_desc_chimeric_cavalry')]"
  mfk_unit_chimeric_cavalry_default: "Chimera Riders"
  mfk_unit_chimeric_cavalry_default_desc: "Placeholder - Galvanic cavalry mounted on plasm-bred chimeric beasts."
  mfk_unit_chimeric_cavalry_cavalier_chargers: "Cavalier Chargers"
  mfk_unit_chimeric_cavalry_cavalier_chargers_desc: "Placeholder - Thoroughbred crossed with stag. A tall, antlered warhorse, ridden as much for status and display as for war."
  mfk_unit_chimeric_cavalry_elk_horse: "Elk-Horse Riders"
  mfk_unit_chimeric_cavalry_elk_horse_desc: "Placeholder - Horse crossed with elk. A sturdy mount for forest travel, and the most accepted mix in the borderlands."
  mfk_unit_chimeric_cavalry_rebel_runners: "Rebel Runners"
  mfk_unit_chimeric_cavalry_rebel_runners_desc: "Placeholder - Mustang crossed with greyhound. Fast, light horses for raids."
  mfk_unit_chimeric_cavalry_spanish_destriers: "Spanish Destriers"
  mfk_unit_chimeric_cavalry_spanish_destriers_desc: "Placeholder - Andalusian crossed with aurochs-like stock. A prestige warhorse of Spain's proud cavalry tradition."

  combat_unit_type_plasm_mortar: "Plasm Mortars"
  combat_unit_type_plasm_mortar_desc: "Placeholder - Galvanic artillery firing shells of raw plasm. High devastation."

  combat_unit_type_voltaic_fusiliers: "[GetPlayer.GetCustom('mfk_unit_name_voltaic_fusiliers')]"
  mfk_unit_voltaic_fusiliers_native: "Sâika Janissaries"
  mfk_unit_voltaic_fusiliers_english: "Voltaic Fusiliers"
  combat_unit_type_voltaic_fusiliers_desc: "Placeholder - Voltaic infantry. Soldiers in sâika plate armed with voltaic-cell weapons."

  combat_unit_type_construct_infantry: "[GetPlayer.GetCustom('mfk_unit_name_construct_infantry')]"
  mfk_unit_construct_infantry_native: "Tılsım Ranks"
  mfk_unit_construct_infantry_english: "Talisman Ranks"
  combat_unit_type_construct_infantry_desc: "Placeholder - Voltaic infantry. Faceless humanoid bronze constructs inscribed with hadith and powered by iksir. Resist morale loss."

  combat_unit_type_construct_guardians: "[GetPlayer.GetCustom('mfk_unit_name_construct_guardians')]"
  mfk_unit_construct_guardians_native: "Tunç Muhafız"
  mfk_unit_construct_guardians_english: "Bronze Guardians"
  combat_unit_type_construct_guardians_desc: "Placeholder - Voltaic Armatura. Towering bronze guardian constructs braced with sâika steel. Very high defense."

  combat_unit_type_arc_artillery: "[GetPlayer.GetCustom('mfk_unit_name_arc_artillery')]"
  mfk_unit_arc_artillery_native: "Sâika Bearers"
  mfk_unit_arc_artillery_english: "Thunderbolt Bearers"
  combat_unit_type_arc_artillery_desc: "Placeholder - Voltaic artillery. Constructs carrying arc-masts that fire iksir lightning."
