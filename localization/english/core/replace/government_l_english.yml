l_english:
 gov_dominion_american_presidential:0 "American Republic"
 gov_dominion_american_presidential_desc:2 "In 1778, George Washington's delegation and the British Empire ratified the [concept_the_compact], an agreement that established an American parliament under a [Concept('concept_ruler','$RULER_TITLE_PRESIDENT_GENERAL|q$')] confirmed by Britain.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_dominion_american_parliamentary:0 "American Dominion"
 gov_dominion_american_parliamentary_desc:2 "In 1778, George Washington's delegation and the British Empire ratified the [concept_the_compact], an agreement that established an American parliament under a [Concept('concept_ruler','$RULER_TITLE_PRESIDENT_GENERAL|q$')] confirmed by Britain.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_governor_american_presidential:0 "American Governorship"
 gov_governor_american_presidential_desc:2 "Under the American Dominion, some states were given a greater degree of autonomy.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_princely_state_american:0 "Covenant Prince"
 gov_princely_state_american_desc:0 "A form of government established in 1778, based around a British-confirmed representative elected by a Council of Clan Mothers that acts as the supreme power over the traditional Iroquois Hoyaneh.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 RULER_TITLE_GRAND_HOYANEH:0 "Grand Hoyaneh"
 RULER_TITLE_TADODAHO:0 "Tadodaho"
 gov_tadodaho_council:0 "Onondaga Council"
 gov_tadodaho_council_desc:0 "The office of the Grand Hoyaneh has been set aside, and the Confederacy is led by the Tadodaho, the Firekeeper of Onondaga, who answers to the Great Law and to the Clan Mothers who raised him up.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 RULER_TITLE_PRESIDENT_GENERAL:0 "President-General"
 gov_compagnie_des_indes:0 "Conseil Supérieur"
 gov_compagnie_des_indes_desc:0 "The Compagnie des Indes, bankrupt since 1769, governs Pondicherry and the Circars through its Conseil supérieur. Its [Concept('concept_ruler','$RULER_TITLE_COMMANDANT_GENERAL|q$')] answers to the restored Crown in name, but the officers who ran French India alone through the years of warlordism have not forgotten it.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 RULER_TITLE_COMMANDANT_GENERAL:0 "Commandant-Général"
