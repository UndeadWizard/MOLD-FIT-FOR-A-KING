l_english:
 je_cajun_rebellion:0 "Great Cajun Rebellion"
 je_cajun_rebellion_reason:0 "The Creole of Louisiane rise against the Spanish, no longer willing to tolerate their [concept_great_insult]. The memory of 1768, when our forebears rose in defiance against Spanish oppression, has led to this moment. The spirit of resistance awakens once more, a fire lit anew in our hearts. Now is the time for liberation, a new Creole nation."

 je_group_john_brant:0 "Horns of John Brant"
 je_john_brant_rule:0 "The Horns of John Brant"
 je_john_brant_rule_reason:0 "Four years ago, Isaac Brant's tyranny came to a bloody end. Blinded by British gold and alcohol, Isaac attempted to rule the League as an absolute Autocrat - intimidating the Longhouse with a personal militia of young, radicalized warriors. After enduring his iron grip for twenty long years, a traditionalist faction led by his half-brother, John Brant, launched a coup, assassinating the tyrant and reclaiming the Great Law of Peace. Taking up the mantle of [concept_grand_hoyaneh], John now rules with a singular focus: to reconcile the fractured clans.\n\n#tooltippable;tooltip:mfk_brant_clan_mother_tt #b Clan Mother Agenda#!#!:\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_cm_harmony')] #v Council Harmony#! is #v 70#! or above\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_cm_clan_mother')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_clan_mother').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_cm_land')] [ROOT.GetCountry.GetNameNoFlag] owns all of [GetStateRegion('STATE_SIX_NATIONS').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_cm_maize')] [ROOT.GetCountry.GetNameNoFlag] has #v 20#! levels of [GetBuildingType('building_maize_farm').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_cm_pb_marginal')] The [GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetName] [concept_interest_group] is [concept_marginalized]\n#tooltippable;tooltip:mfk_brant_grand_hoyaneh_tt #b Brant's Vision#!#!:\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_gh_plasm')] [ROOT.GetCountry.GetNameNoFlag] has #v 5#! levels of [GetBuildingType('building_plasm_industry').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_gh_railways')] [ROOT.GetCountry.GetNameNoFlag] has #v 5#! levels of [GetBuildingType('building_railway').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_gh_army')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_professional_army').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_gh_urban')] [ROOT.GetCountry.GetNameNoFlag] has a level #v 3#! [GetBuildingType('building_urban_center').GetName] in a [GetCulture('iroquoian').GetName] [concept_homeland] [concept_state]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_gh_pb_clout')] The [concept_clout] of the [GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetName] [concept_interest_group] is #v 10#! or above\n#tooltippable;tooltip:mfk_brant_shared_tt #b Shared Agenda#!#!:\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_sh_famine')] #b No#! owned [GetCulture('iroquoian').GetName] [concept_homeland] [concept_state] is suffering from [concept_famine]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_sh_crown')] Great Britain has at least #v Cordial#! [concept_relations] with [ROOT.GetCountry.GetNameNoFlag]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_sh_gdp')] [ROOT.GetCountry.GetNameNoFlag] has a [Concept('concept_gdp', '$concept_gdp_short|q$')] of @gdp!#v [ROOT.GetCountry.MakeScope.Var('mfk_brant_gdp_goal').GetValue|k0]#! or above\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_sh_army')] [ROOT.GetCountry.GetAdjectiveNoFlag] army [concept_power_projection] is greater than #v 100#!"
 je_brant_crisis_success_tt:0 "We have completed at least #v 8#! agenda goals"
 je_brant_crisis_success_2_tt:0 "Depending on the number of #tooltippable;tooltip:mfk_brant_shared_tt #b Shared#!#!, #tooltippable;tooltip:mfk_brant_grand_hoyaneh_tt #b Brant's Vision#!#!, or #tooltippable;tooltip:mfk_brant_clan_mother_tt #b Clan Mother#!#! goals completed, the reward will change"
 mfk_brant_clan_mother_tt:0 "The #b Clan Mothers#! hold that the League must govern as the Great Law intends: by consensus around the Council Fire, with the Clan Mothers' voice heard and the Haudenosaunee rooted in their own land.\n\nKeeping #v Council Harmony#! high strengthens the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] and the government's legitimacy."
 mfk_brant_grand_hoyaneh_tt:0 "#b John Brant#! believes the League must change to survive, but without returning to his father's tyranny: plasm works, railways and towns that can stand beside the British and the Union, and a professional army in place of Isaac's warbands.\n\nThe #b Dehorners#! would go further, and restore the [GetLawType('law_hoyaneh_ascendancy').GetName] that Isaac ruled by. Every step the Confederacy takes toward it strengthens their hand, not Brant's."
 mfk_brant_shared_tt:0 "Both the #b Clan Mothers#! and the #b Grand Hoyaneh#! agree that the League must be able to defend itself and feed its people."

 je_tadodaho: "The Onondaga Council Fire"
 je_tadodaho_reason: "At Onondaga the Council Fire of the Haudenosaunee still burns, kept by the [concept_tadodaho]. Whatever bargains the [concept_grand_hoyaneh] strikes with the Crown and the Union, the Tadodaho answers only to the Great Law and the Clan Mothers who raised him up."
 je_tadodaho_advance_header: "#bold Council Harmony#! is the [concept_grand_hoyaneh]'s standing with the Council. It #bold rises#! when:"
 je_tadodaho_advance: "• A law passes with #v 5 of 5#! founding nations in agreement: #g +10#!\n• A law passes with #v 4 of 5#! in agreement: #g +5#!"
 je_tadodaho_deplete_header: "It #bold falls#! when:"
 je_tadodaho_deplete: "• A law is forced through with #v 2 or fewer#! founding nations in agreement: #r -10#!\n• [GetLawType('law_hoyaneh_ascendancy').GetName] is enacted: #r -15#!\n• [GetLawType('law_clan_mother').GetName] is abandoned: #r -10#!\n• [GetLawType('law_council_fires').GetName] is abandoned: #r -20#!\n• [GetLawType('law_religious_schools').GetName] is enacted while the state religion is not the Longhouse faith: #r -10#!\n• Pressing the Council and other actions spend it\n\nIf it reaches #r 0#!, the [concept_grand_hoyaneh] is deposed."
 mfk_council_harmony_bar: "Council Harmony"
 mfk_council_harmony_bar_desc: "Council Harmony: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!/100"
 je_dehorning_crisis: "The Antlers of Office"
 je_dehorning_crisis_reason: "Under the Great Law, the Clan Mothers who raise up a chief may also take back his Antlers of Office. With the Council Fire divided, they have begun to speak of dehorning the [concept_grand_hoyaneh].\n\nIf harmony between the Grand Hoyaneh and the [concept_tadodaho] can be restored, the crisis will pass. If not, the antlers must be decided."
 mfk_dehorning_reconciled_tt: "#v Council Harmony#! is at least #v 50#!"
 mfk_dehorning_begins_tt: "The crisis over the Antlers of Office begins. Restore #v Council Harmony#! to #v 50#! within two years, or the matter will be decided."
 je_calhoun_revolt: "The Calhoun Revolt"
 je_calhoun_revolt_reason: "PLACEHOLDER - John Calhoun's South Carolina defies the Union."
 je_calhoun_revolt_scr_gone_tt: "South Carolina has been brought back under Union control"

 je_john_brant_rule_advance_header: "The following conditions will shift the balance toward the #bold Dehorners#! by #variable 1#! every month:"
 je_john_brant_rule_deplete_header: "The following conditions will shift the balance toward the #bold Council Fire#! by #variable 1#! every month:"
 mfk_antlers_balance_bar: "The Antlers of Office"
 mfk_antlers_balance_bar_fire_desc: "Council Fire: [Divide_CFixedPoint(Subtract_CFixedPoint(ScriptedProgressBar.GetMaxValue, JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)), Subtract_CFixedPoint(ScriptedProgressBar.GetMaxValue, ScriptedProgressBar.GetMinValue))|v%]"
 mfk_antlers_balance_bar_dehorners_desc: "Dehorners: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!"
 mfk_antlers_fire_harmony: "#v Council Harmony#! is #v 60#! or above"
 mfk_antlers_fire_clan_mother: "[GetPlayer.GetNameNoFlag] has the [GetLawType('law_clan_mother').GetName] [concept_law]"
 mfk_antlers_fire_movement: "The #b Movement for the Great Law#! has at least #v 5%#! support"
 mfk_antlers_dehorners_harmony: "#v Council Harmony#! is #v 40#! or below"
 mfk_antlers_dehorners_warriors: "[GetPlayer.GetNameNoFlag] has [GetLawType('law_hoyaneh_ascendancy').GetName] or a [GetLawType('law_professional_army').GetName]"
 mfk_antlers_dehorners_movement: "The #b Dehorners#! have at least #v 5%#! support"
 mfk_antlers_dehorners_war: "[GetPlayer.GetNameNoFlag] is at [concept_war]"
 mfk_antlers_fire_council_fires: "[GetPlayer.GetNameNoFlag] has the [GetLawType('law_council_fires').GetName] [concept_law]"
 mfk_press_the_council_button: "Press the Council"
 mfk_press_the_council_button_desc: "The [concept_grand_hoyaneh] calls on the Royaneh to set aside the long deliberations of the Council Fire and carry the law now before them. The law will pass more easily, but the Council will remember being hurried."
 mfk_press_council_enacting_tt: "[GetPlayer.GetNameNoFlag] is enacting a [concept_law]"
 mfk_press_council_harmony_tt: "#v Council Harmony#! is at least #v 20#!"
 mfk_press_council_active_tt: "The Council has not already been pressed"
 mfk_fire_out_effect_tt: "The office of the [concept_tadodaho] is abolished, and the [GetLawType('law_council_fires').GetName] can never be restored"
 mfk_council_fire_renewed_tt: "The #b Horns of John Brant#! ended with the #b Council Fire#! holding the balance"
 mfk_council_fire_out_tt: "The #b Horns of John Brant#! ended with the #b Dehorners#! holding the balance"



 je_forest_of_bayonets_reason: "Since the end of the Coalition Wars against the French Republic, the reactionary order enshrined at the $glossary_congress_of_vienna$ has reigned across [GetGeographicRegion('geographic_region_europe').GetName]. Despite the shock provided by the [glossary_revolutions_of_1830], the integration of #b Belgium#! and the restored Bourbon crown of #b Louis XVII#! into the Congress order has assured its survival for the time being. Fearful of another $glossary_1792$, the absolutist and conservative constitutional regimes alike have formed a phalanx to repress any hint of revolutionary activity.\n\nEven with these efforts, however, the dream of Liberty, Equality, and Fraternity is not dead. [Concept('concept_revolution', '$concept_revolutionary|q$')] forces remain dedicated to overthrowing the Congress order, and the resentment of the impoverished and disenfranchised working class has created the threat of social eruption within every European capital. Given a sufficient spark, all of Europe may find itself aflame.\n\n@warning! If [Concept('concept_revolution', '$concept_revolutionary|q$')] activity hits critical mass, the fragile Congress order will erupt into a #b Revolutionary Spring#!"
 mfk_reopen_longhouse_button: "Reopen the Onondaga Longhouse"
 mfk_reopen_longhouse_button_desc: "Isaac Brant let the council longhouse at Onondaga fall into ruin. Rebuilding it would show the Royaneh that the Grand Hoyaneh governs beneath the Council's roof."
 mfk_return_clan_lands_button: "Return the Clan Lands"
 mfk_return_clan_lands_button_desc: "Give back the fields Isaac Brant seized for his warriors and his British friends, and let the Clan Mothers once more decide who works them."
 mfk_western_door_rangers_button: "Raise the Western Door Rangers"
 mfk_crown_muskets_button: "Accept the Crown's Muskets"
 mfk_crown_muskets_button_desc: "The British offer muskets and powder to the war chiefs who fought beside the Crown. London wants a strong ally on the Union's flank; the Clan Mothers see the Crown buying another Isaac."
 mfk_norton_war_chief_button: "Name Norton War Chief of the Western Door"
 mfk_harmony_40_tt: "#v Council Harmony#! is at least #v 40#!"
 mfk_holds_frontier_tt: "The Confederacy holds land beyond the Six Nations"
 mfk_norton_alive_tt: "Alexander Norton is alive and in the Confederacy"
 mfk_western_door_rangers_button_desc: "Raise a standing company of rangers, with barracks on the frontier, to watch the Union's settlers. The Confederacy needs them, but their officers will be the war chiefs' men."
 mfk_norton_war_chief_button_desc: "Give Alexander Norton, grandson of Teyoninhokarawen, command of the Western Door Rangers. No one would lead them better, and no one would be more dangerous to the antlers."
 mfk_owns_six_nations_tt: "[ROOT.GetCountry.GetNameNoFlag] owns all of [GetStateRegion('STATE_SIX_NATIONS').GetName]"
