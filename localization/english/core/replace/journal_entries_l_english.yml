 je_dehorning_crisis: "The Antlers of Office"
 je_dehorning_crisis_reason: "Under the Great Law, the Clan Mothers who raise up a chief may also take back his Antlers of Office. With the Council Fire divided, they have begun to speak of dehorning the [concept_grand_hoyaneh].\n\nIf harmony between the Grand Hoyaneh and the [concept_tadodaho] can be restored, the crisis will pass. If not, the antlers must be decided."
 mfk_dehorning_reconciled_tt: "#v Council Harmony#! is at least #v 50#!"
 mfk_dehorning_begins_tt: "The crisis over the Antlers of Office begins. Restore #v Council Harmony#! to #v 50#! within two years, or the matter will be decided."
 je_calhoun_revolt: "The Calhoun Revolt"
 je_calhoun_revolt_reason: "PLACEHOLDER - John Calhoun's South Carolina defies the Union."
 je_calhoun_revolt_scr_gone_tt: "South Carolina has been brought back under Union control"
