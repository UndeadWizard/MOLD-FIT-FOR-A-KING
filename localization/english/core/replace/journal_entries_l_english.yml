 mfk_antlers_fire_council_fires: "[GetPlayer.GetNameNoFlag] has the [GetLawType('law_council_fires').GetName] [concept_law]"
 mfk_press_the_council_button: "Press the Council"
 mfk_press_the_council_button_desc: "The [concept_grand_hoyaneh] calls on the Royaneh to set aside the long deliberations of the Council Fire and carry the law now before them. The law will pass more easily, but the Council will remember being hurried."
 mfk_press_council_enacting_tt: "[GetPlayer.GetNameNoFlag] is enacting a [concept_law]"
 mfk_press_council_harmony_tt: "#v Council Harmony#! is at least #v 20#!"
 mfk_press_council_active_tt: "The Council has not already been pressed"
 mfk_fire_out_effect_tt: "The office of the [concept_tadodaho] is abolished, and the [GetLawType('law_council_fires').GetName] can never be restored"
 mfk_council_fire_renewed_tt: "The #b Horns of John Brant#! ended with the #b Council Fire#! holding the balance"
 mfk_council_fire_out_tt: "The #b Horns of John Brant#! ended with the #b Dehorners#! holding the balance"



 je_forest_of_bayonets_reason: "Since the end of the Coalition Wars against the French Republic, the reactionary order enshrined at the $glossary_congress_of_vienna$ has reigned across [GetGeographicRegion('geographic_region_europe').GetName]. Despite the shock provided by the [glossary_revolutions_of_1830], the integration of #b Belgium#! and the restored Bourbon crown of #b Louis XVII#! into the Congress order has assured its survival for the time being. Fearful of another $glossary_1792$, the absolutist and conservative constitutional regimes alike have formed a phalanx to repress any hint of revolutionary activity.\n\nEven with these efforts, however, the dream of Liberty, Equality, and Fraternity is not dead. [Concept('concept_revolution', '$concept_revolutionary|q$')] forces remain dedicated to overthrowing the Congress order, and the resentment of the impoverished and disenfranchised working class has created the threat of social eruption within every European capital. Given a sufficient spark, all of Europe may find itself aflame.\n\n@warning! If [Concept('concept_revolution', '$concept_revolutionary|q$')] activity hits critical mass, the fragile Congress order will erupt into a #b Revolutionary Spring#!"
 mfk_reopen_longhouse_button: "Reopen the Onondaga Longhouse"
 mfk_reopen_longhouse_button_desc: "Isaac Brant let the council longhouse at Onondaga fall into ruin. Rebuilding it would show the Royaneh that the Grand Hoyaneh governs beneath the Council's roof."
 mfk_return_clan_lands_button: "Return the Clan Lands"
 mfk_return_clan_lands_button_desc: "Give back the fields Isaac Brant seized for his warriors and his British friends, and let the Clan Mothers once more decide who works them."
 mfk_western_door_rangers_button: "Raise the Western Door Rangers"
 mfk_crown_muskets_button: "Accept the Crown's Muskets"
 mfk_crown_muskets_button_desc: "The British offer muskets and powder to the war chiefs who fought beside the Crown. London wants a strong ally on the Union's flank; the Clan Mothers see the Crown buying another Isaac."
 mfk_norton_war_chief_button: "Name Norton War Chief of the Western Door"
 mfk_harmony_40_tt: "#v Council Harmony#! is at least #v 40#!"
 mfk_holds_frontier_tt: "The Confederacy holds land beyond the Six Nations"
 mfk_norton_alive_tt: "Alexander Norton is alive and in the Confederacy"
 mfk_western_door_rangers_button_desc: "Raise a standing company of rangers, with barracks on the frontier, to watch the Union's settlers. The Confederacy needs them, but their officers will be the war chiefs' men."
 mfk_norton_war_chief_button_desc: "Give Alexander Norton, grandson of Teyoninhokarawen, command of the Western Door Rangers. No one would lead them better, and no one would be more dangerous to the antlers."
 mfk_owns_six_nations_tt: "[ROOT.GetCountry.GetNameNoFlag] owns all of [GetStateRegion('STATE_SIX_NATIONS').GetName]"
 mfk_longhouse_reopened_tt: "The Onondaga Longhouse has been reopened"
 mfk_rangers_raised_tt: "The Western Door Rangers have been raised"
 mfk_council_fire_strong_tt: "The #b Council Fire#! holds at least #v 60%#! of the balance for the Antlers of Office"
 mfk_dehorners_strong_tt: "The #b Dehorners#! hold at least #v 60%#! of the balance for the Antlers of Office"
 mfk_crown_cordial_tt: "Great Britain has at least #v Cordial#! [concept_relations] with [ROOT.GetCountry.GetNameNoFlag]"
 mfk_rangers_barracks_tt: "#v 2#! levels of [GetBuildingType('building_barrack').GetName] are raised in a frontier [concept_state]"
 mfk_antlers_fire_small_tt: "The balance for the Antlers of Office shifts #v slightly#! toward the #b Council Fire#!"
 mfk_antlers_fire_medium_tt: "The balance for the Antlers of Office shifts toward the #b Council Fire#!"
 mfk_antlers_fire_large_tt: "The balance for the Antlers of Office shifts #v greatly#! toward the #b Council Fire#!"
 mfk_antlers_dehorners_small_tt: "The balance for the Antlers of Office shifts #v slightly#! toward the #b Dehorners#!"
 mfk_antlers_dehorners_medium_tt: "The balance for the Antlers of Office shifts toward the #b Dehorners#!"
 mfk_antlers_dehorners_large_tt: "The balance for the Antlers of Office shifts #v greatly#! toward the #b Dehorners#!"

 je_brant_deposed_tt: "#v Council Harmony#! has reached #r 0#! and the Council has taken John Brant's Antlers of Office"
 mfk_calhoun_revolt_will_happen_tt: "The Cavalier States will break away from the Union as the #v Cavalier Confederation#!"
 je_mfk_chimeric_question:0 "The Chimeric Question"
 je_mfk_chimeric_question_reason:0 "Philadelphia enforces the Crown's Abolition Act, except where it does not. In the Slave States, Verdigri are held as tools and free Verdigri are bound for their refinement debts. In the Cavalier Governorships, Jackson has never enforced the Act at all. Whitehall, the Columbian North and the courts are all pressing for an answer.\n\nWhen #b Tension#! reaches #v 100#!, the Chimeric Question will be settled on whichever side #b the Question#! stands."
 mfk_cq_settled_by_law_tt:0 "The Union has changed its slavery law"
 mfk_cq_question_bar:0 "The Question"
 mfk_cq_question_bar_left_desc:0 "Verdigri Compromise: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]%#!"
 mfk_cq_question_bar_right_desc:0 "Enforce the Act: #v [Subtract_CFixedPoint('(CFixedPoint)100', JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self))|0]%#!"
 mfk_cq_tension_bar:0 "Tension"
 mfk_cq_tension_bar_desc:0 "Tension: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!/100"
 mfk_cq_from_landowner_clout:0 "[concept_clout] of the Landowners"
 mfk_cq_from_intelligentsia_clout:0 "[concept_clout] of the Intelligentsia"
 mfk_cq_from_landowners_in_government:0 "the Landowners in [concept_government]"
 mfk_cq_from_intelligentsia_in_government:0 "the Intelligentsia in [concept_government]"
 mfk_cq_from_american_governor_general:0 "an American [concept_governor_general]"
 mfk_cq_from_british_governor_general:0 "a British [concept_governor_general] pressing Whitehall's line"
 mfk_cq_from_grey_trade:0 "the Grey Trade in the Slave States"
 mfk_cq_from_crackdowns:0 "Verdigri Crackdowns"
 mfk_cq_from_gag_rule:0 "the Gag Rule"
 mfk_cq_tension_from_base:0 "the Chimeric Question going unanswered"
 mfk_cq_tension_from_polarisation:0 "how far the Question leans"
 mfk_cq_tension_from_crackdowns:0 "Verdigri Crackdowns"
 mfk_cq_tension_from_gag_rule:0 "the Gag Rule"
 mfk_cq_gag_rule_on_button:0 "Adopt the Gag Rule"
 mfk_cq_gag_rule_on_button_desc:0 "Table every petition on slavery in the Commons unread. Tension rises far more slowly, but the Question drifts towards the Compromise and the Intelligentsia resent it."
 mfk_cq_gag_rule_off_button:0 "Lift the Gag Rule"
 mfk_cq_gag_rule_off_button_desc:0 "Let the Commons hear the abolitionists' petitions again."
 mfk_cq_petition_whitehall_button:0 "Petition Whitehall"
 mfk_cq_petition_whitehall_button_desc:0 "Ask the Governor-General to put the Question to the Crown. Whitehall will press for enforcement: the Question moves towards #v Enforce the Act#! and Tension rises, but relations with Britain improve. The delegation to London is not cheap."
 mfk_cq_government_house_button:0 "Have Government House Look Away"
 mfk_cq_government_house_button_desc:0 "Our American Governor-General can keep Whitehall's letters in a drawer. The Question moves towards the #v Verdigri Compromise#!, at the cost of relations with Britain and a year of quiet payments."
 mfk_cq_compensation_button:0 "Raise a Compensation Fund"
 mfk_cq_compensation_button_desc:0 "Britain paid its slaveholders twenty million pounds in 1833. A fund to buy out the Cavalier planters would make enforcement far easier to swallow."
 mfk_cq_compensation_tt:0 "If the Act is enforced, Governorships with liberty desire below #v 50#! will stay loyal instead of joining Calhoun"
 mfk_cq_question_enforce_side_tt:0 "The Question is at #v 40#! or below (leaning towards Enforce the Act)"
 mfk_cq_law_locked_tt:0 "The #v Chimeric Question#! must be settled through its [concept_journal_entry], not by changing the law directly"
 mfk_cq_from_moderates:0 "moderates in the Commons"
 mfk_cq_from_past_choices:0 "our earlier choices"
 mfk_cq_outcome_compromise_tt:0 "If the Question leans towards the #v Verdigri Compromise#!, the Compromise passes"
 mfk_cq_outcome_enforce_tt:0 "If the Question leans towards #v Enforce the Act#!, the Act is enforced"
 mfk_cq_question_compromise_lean_tt:0 "The Question leans towards the #v Verdigri Compromise#! (#v 45%#! or more). Whitehall will only weigh in to pull it back"
 mfk_cq_question_enforce_lean_tt:0 "The Question leans towards #v Enforce the Act#! (#v 55%#! Compromise or less). Government House will only look away to pull it back"
 mfk_cq_opened_tt:0 "The #v Parliamentary Investigation#! has reported"
 je_mfk_election_1836:0 "The Election of 1836"
 je_mfk_election_1836_reason:0 "Andrew Jackson's coalition has governed the Union since 1828, and it will govern until the voters have spoken. They will not be kind to it. The Whigs are ascendant, but divided. The party's establishment of merchants and manufacturers wants to win the Cavalier States as well as the North, and will say whatever the South needs to hear about the Crown's Abolition Act. The Barnburners want the Act enforced in full, whatever it costs. And Jackson's coalition has not given up.\n\nCampaign support:\n#b The Jacksonian Democracy#!: #v [GetPlayer.MakeScope.ScriptValue('mfk_e1836_jacksonian_support_share')|%0]#!\n#b The Whig Establishment#!: #v [GetPlayer.MakeScope.ScriptValue('mfk_e1836_whig_support_share')|%0]#!\n#b The Barnburners#!: #v [GetPlayer.MakeScope.ScriptValue('mfk_e1836_barnburner_support_share')|%0]#!"
 mfk_e1836_jacksonian_wins_tt:0 "When the election ends, #b The Jacksonian Democracy#! (the Rural Folk and the Landowners) has the most campaign support"
 mfk_e1836_whig_wins_tt:0 "When the election ends, #b The Whig Establishment#! (the Industrialists and the Petty Bourgeoisie) has the most campaign support"
 mfk_e1836_barnburner_wins_tt:0 "When the election ends, #b The Barnburners#! (the Intelligentsia) have the most campaign support"
 je_mfk_panic_1837:0 "The Bank Crash of 1837"
 je_mfk_panic_1837_reason:0 "The banks of New York have stopped paying out in coin, and the rest of British North America has followed. Credit has vanished, the British market is buying less cotton, grain and timber, and every merchant in Philadelphia is calling in his debts at once.\n\nWhen #b Recovery#! is full, the crash is over across the Union, its Governorships and Canada."
 mfk_e1836_fund_jacksonian_button:0 "Fund the Jacksonian Democracy"
 mfk_e1836_fund_jacksonian_button_desc:0 "Put the Union's patronage behind Jackson's chosen successor. #b The Jacksonian Democracy#! gains #v 6#! campaign support, some [concept_momentum] in the election and six months of extra [concept_political_strength], at the cost of six months of campaign expenses."
 mfk_e1836_fund_whig_button:0 "Fund the Whig Establishment"
 mfk_e1836_fund_whig_button_desc:0 "Fund the Whig establishment's candidates. #b The Whig Establishment#! gains #v 6#! campaign support, some [concept_momentum] in the election and six months of extra [concept_political_strength], at the cost of six months of campaign expenses."
 mfk_e1836_fund_barnburner_button:0 "Fund the Barnburners"
 mfk_e1836_fund_barnburner_button_desc:0 "Throw in with the Barnburner Whigs, who would burn the barn to rid it of the rats. #b The Barnburners#! gain #v 6#! campaign support, some [concept_momentum] in the election and six months of extra [concept_political_strength], at the cost of six months of campaign expenses."
 mfk_e1836_funding_cooldown_tt:0 "The Union has not funded a campaign in the past #v 180#! days"
 mfk_cq_tension_40_tt:0 "#b Tension#! is at #v 40#! or more: the crisis has come to a head"
 mfk_cq_tension_from_extreme:0 "the Union polarised at either extreme of the Question"
 mfk_cq_compromise_bill_button:0 "Bring the Compromise Bill to the Commons"
 mfk_cq_compromise_bill_button_desc:0 "Introduce the Verdigri Compromise as a bill. It is enacted like any law, until it reaches the #v Study#! phase and the division is called: if the #b Question#! still leans towards the Compromise at that point, it carries."
 mfk_cq_enforcement_bill_button:0 "Bring the Enforcement Bill to the Commons"
 mfk_cq_enforcement_bill_button_desc:0 "Introduce a bill to enforce the Crown's Act in every province and Governorship. It is enacted like any law, until it reaches the #v Study#! phase and the division is called: if the #b Question#! still leans towards enforcement at that point, it carries."
