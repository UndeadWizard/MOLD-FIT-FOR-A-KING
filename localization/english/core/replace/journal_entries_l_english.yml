l_english:
 je_cajun_rebellion:0 "Great Cajun Rebellion"
 je_cajun_rebellion_reason:0 "The Creole of Louisiane rise against the Spanish, no longer willing to tolerate their [concept_great_insult]. The memory of 1768, when our forebears rose in defiance against Spanish oppression, has led to this moment. The spirit of resistance awakens once more, a fire lit anew in our hearts. Now is the time for liberation, a new Creole nation."

 je_group_john_brant:0 "Horns of John Brant"
 je_john_brant_rule:0 "The Horns of John Brant"
 je_john_brant_rule_reason:0 "Four years ago, Isaac Brant's tyranny came to a bloody end. Blinded by British gold and alcohol, Isaac attempted to rule the League as an absolute Autocrat - intimidating the Longhouse with a personal militia of young, radicalized warriors. After enduring his iron grip for twenty long years, a traditionalist faction led by his half-brother, John Brant, launched a coup, assassinating the tyrant and reclaiming the Great Law of Peace. Taking up the mantle of [concept_grand_hoyaneh], John now rules with a singular focus: to reconcile the fractured clans.\n\n#tooltippable;tooltip:mfk_brant_clan_mother_tt #b Clan Mother Agenda#!#!:\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_cm_harmony')] #v Council Harmony#! is #v 70#! or above\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_cm_clan_mother')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_clan_mother').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_cm_land')] [ROOT.GetCountry.GetNameNoFlag] owns all of [GetStateRegion('STATE_SIX_NATIONS').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_cm_maize')] [ROOT.GetCountry.GetNameNoFlag] has #v 20#! levels of [GetBuildingType('building_maize_farm').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_cm_pb_marginal')] The [GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetName] [concept_interest_group] is [concept_marginalized]\n#tooltippable;tooltip:mfk_brant_grand_hoyaneh_tt #b Grand Hoyaneh Agenda#!#!:\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_gh_harmony')] #v Council Harmony#! is #v 30#! or below\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_gh_ascendancy')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_hoyaneh_ascendancy').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_gh_army')] [ROOT.GetCountry.GetNameNoFlag] has enacted [GetLawType('law_professional_army').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_gh_urban')] [ROOT.GetCountry.GetNameNoFlag] has a level #v 3#! [GetBuildingType('building_urban_center').GetName] in a [GetCulture('iroquoian').GetName] [concept_homeland] [concept_state]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_gh_pb_clout')] The [concept_clout] of the [GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetName] [concept_interest_group] is #v 10#! or above\n#tooltippable;tooltip:mfk_brant_shared_tt #b Shared Agenda#!#!:\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_sh_famine')] #b No#! owned [GetCulture('iroquoian').GetName] [concept_homeland] [concept_state] is suffering from [concept_famine]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_sh_crown')] Great Britain has at least #v Cordial#! [concept_relations] with [ROOT.GetCountry.GetNameNoFlag]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_brant_cb_sh_army')] [ROOT.GetCountry.GetAdjectiveNoFlag] army [concept_power_projection] is greater than #v 100#!"
 je_brant_crisis_success_tt:0 "We have completed at least #v 8#! agenda goals"
 je_brant_crisis_success_2_tt:0 "Depending on the number of #tooltippable;tooltip:mfk_brant_shared_tt #b Shared#!#!, #tooltippable;tooltip:mfk_brant_grand_hoyaneh_tt #b Grand Hoyaneh#!#!, or #tooltippable;tooltip:mfk_brant_clan_mother_tt #b Clan Mother#!#! goals completed, the reward will change"
 mfk_brant_clan_mother_tt:0 "The #b Clan Mothers#! hold that the League must govern as the Great Law intends: by consensus around the Council Fire, with the Clan Mothers' voice heard and the Haudenosaunee rooted in their own land.\n\nKeeping #v Council Harmony#! high strengthens the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] and the government's legitimacy."
 mfk_brant_grand_hoyaneh_tt:0 "The #b Grand Hoyaneh#! believes the League must change to survive: a stronger executive, open trade and towns that can stand beside the British and the Union.\n\nGoverning with a free hand while #v Council Harmony#! is low speeds reform and strengthens the merchants and industrialists, at the cost of legitimacy and the risk of dehorning."
 mfk_brant_shared_tt:0 "Both the #b Clan Mothers#! and the #b Grand Hoyaneh#! agree that the League must be able to defend itself and feed its people."

 # Mold Fit for a King
 je_tadodaho: "The Onondaga Council Fire"
 je_tadodaho_reason: "At Onondaga the Council Fire of the Haudenosaunee still burns, kept by the [concept_tadodaho]. Whatever bargains the [concept_grand_hoyaneh] strikes with the Crown and the Union, the Tadodaho answers only to the Great Law and the Clan Mothers who raised him up.\n\n#g #b Strengthens the Council#!#!\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_harmony_cb_clan_mother')] [GetLawType('law_clan_mother').GetName] is enacted\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_harmony_cb_traditional')] The [concept_grand_hoyaneh] is a [GetIdeology('ideology_traditionalist').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_harmony_cb_devout_content')] [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] [concept_approval] is #v 5#! or more\n\n#r #b Weakens the Council#!#!\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_harmony_cb_ascendancy')] [GetLawType('law_hoyaneh_ascendancy').GetName] is enacted\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_harmony_cb_mission_schools')] [GetLawType('law_religious_schools').GetName] is enacted\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_harmony_cb_devout_angry')] [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] [concept_approval] is #v -5#! or less\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_harmony_cb_war')] At [concept_war]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('mfk_harmony_cb_unrest')] A [concept_state] has over #v 20%#! [concept_turmoil]"
